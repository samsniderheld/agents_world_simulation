<div class="tab-panel" data-tab-panel="visuals" hidden>
  <div class="toolbar">
    <div class="status-pill" id="visualsStatusPill"><span class="dot"></span><span id="visualsStatusText">idle</span></div>
    <div class="error-msg" id="visualsErrorMsg"></div>
    <div class="spacer"></div>
  </div>

  <div class="layout">
    <aside>
      <div class="section">
        <h2>Generate Image</h2>
        <div class="field">
          <label>Prompt</label>
          <textarea id="imagePromptInput" rows="3" placeholder="A neon-lit noir street at midnight…"></textarea>
        </div>
        <div class="field">
          <label>Starting image (optional -- edits it instead of generating from scratch)</label>
          <input type="file" id="imageFileInput" accept="image/*" />
          <div class="thumb-preview" id="imageFilePreview" style="display:none"></div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Aspect ratio</label>
            <select id="imageAspectInput">
              <option value="auto">auto</option>
              <option value="1:1" selected>1:1</option>
              <option value="16:9">16:9</option>
              <option value="9:16">9:16</option>
              <option value="4:3">4:3</option>
              <option value="3:4">3:4</option>
              <option value="3:2">3:2</option>
              <option value="2:3">2:3</option>
              <option value="21:9">21:9</option>
            </select>
          </div>
          <div class="field">
            <label>Resolution</label>
            <select id="imageResolutionInput">
              <option value="1K" selected>1K</option>
              <option value="2K">2K</option>
              <option value="4K">4K</option>
            </select>
          </div>
        </div>
        <button class="primary" id="generateImageBtn" style="width:100%">▶ Generate Image</button>
      </div>

      <div class="section">
        <h2>Generate Video</h2>
        <div class="field">
          <label>Source image</label>
          <div class="thumb-preview" id="videoSourcePreview">No image selected -- pick "Animate this" on a generated image, or upload one below.</div>
          <input type="file" id="videoFileInput" accept="image/*" />
        </div>
        <div class="field">
          <label>Animation prompt</label>
          <textarea id="videoPromptInput" rows="3" placeholder="The neon sign flickers, rain streaks across the lens…"></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Aspect ratio</label>
            <select id="videoAspectInput">
              <option value="16:9" selected>16:9</option>
              <option value="9:16">9:16</option>
            </select>
          </div>
          <div class="field">
            <label>Duration (s)</label>
            <input type="number" id="videoDurationInput" value="8" min="1" max="30" />
          </div>
        </div>
        <div class="field">
          <label>Resolution</label>
          <select id="videoResolutionInput">
            <option value="360p">360p</option>
            <option value="720p" selected>720p</option>
            <option value="1080p">1080p</option>
            <option value="4k">4k</option>
          </select>
        </div>
        <button class="primary" id="generateVideoBtn" style="width:100%" disabled>▶ Generate Video</button>
      </div>
    </aside>

    <main class="visuals-main" id="visualsMain">
      <div class="empty" id="visualsEmpty">Write a prompt on the left and hit <b>Generate Image</b>.</div>
      <div class="visuals-gallery" id="visualsGallery"></div>
    </main>
  </div>
</div>
