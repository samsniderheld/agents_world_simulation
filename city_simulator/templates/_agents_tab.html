<div class="tab-panel" data-tab-panel="agents" hidden>
  <div class="toolbar">
    <div class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">idle</span></div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="spacer"></div>
    <button class="primary" id="startBtn">▶ Start</button>
    <button class="danger" id="stopBtn" style="display:none">■ Stop</button>
  </div>

  <div class="layout">
    <aside>
      <div class="section">
        <h2>Run</h2>
        <div class="field-row">
          <div class="field">
            <label>Ticks</label>
            <input type="number" id="ticksInput" value="8" min="1" />
          </div>
          <div class="field">
            <label>Tick pause (s)</label>
            <input type="number" id="tickSleepInput" value="0" min="0" step="0.5" />
          </div>
        </div>
        <div class="field">
          <label>Chat model (blank = server default)</label>
          <input type="text" id="modelInput" list="modelOptions" placeholder="auto" />
          <datalist id="modelOptions"></datalist>
        </div>
        <div class="field">
          <label>Context tokens (blank = server default)</label>
          <input type="number" id="contextInput" placeholder="auto" min="256" />
        </div>
      </div>

      <div class="section">
        <h2>Agents</h2>
        <div id="agentPicker"></div>
      </div>

      <div class="section">
        <h2>Legend</h2>
        <div id="agentLegend"></div>
      </div>

      <div class="section">
        <h2>Event types</h2>
        <div id="kindList"></div>
      </div>

      <div class="section">
        <h2>Search</h2>
        <input type="text" class="search-box" id="searchBox" placeholder="filter text…" />
      </div>
    </aside>

    <main id="agentsMain">
      <div class="empty">Configure agents on the left and hit <b>Start</b>.</div>
    </main>
  </div>
</div>
