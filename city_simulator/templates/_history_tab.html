<div class="tab-panel" data-tab-panel="map">
  <div class="toolbar">
    <div class="status-pill" id="historyStatusPill"><span class="dot"></span><span id="historyStatusText">idle</span></div>
    <div class="status-pill" id="agentsStatusPill"><span class="dot"></span><span id="agentsStatusText">idle</span></div>
    <div class="error-msg" id="historyErrorMsg"></div>
    <div class="error-msg" id="agentsErrorMsg"></div>
    <div class="spacer"></div>
    <button class="danger" id="stopBtn" style="display:none">■ Stop</button>
    <button id="startBtn">▶ Start Agents</button>
    <button class="primary" id="generateBtn">▶ Generate</button>
  </div>

  <main id="historyMain">
    <div class="empty" id="historyEmpty">Hit <b>Generate</b> to build a city.</div>

    <div id="historyContent" style="display:none">
      <header class="masthead-inline">
        <h2 id="cityTitle">Chronicle of the City</h2>
        <div class="subtitle" id="citySubtitle"></div>
        <div class="stats" id="cityStats"></div>
      </header>

      <div class="map-plate">
        <div class="label">A Map of the City, By Era of Settlement</div>
        <div class="map-columns">
          <div class="map-column">
            <div class="city-map-wrap">
              <canvas id="cityCanvas" class="city-canvas" style="display:none"></canvas>
              <div class="city-map-hint" id="cityMapHint" style="display:none">Click a neighborhood, a numbered place, or an agent marker for details</div>
            </div>
            <pre id="mapText"></pre>
            <div class="caption" id="mapCaption"></div>
            <div class="neighborhood-key" id="neighborhoodKey"></div>
          </div>
          <div class="map-column" id="subwayMapPlate" style="display:none">
            <div class="map-column-label">1950s Subway Map</div>
            <img id="subwayMapImg" alt="A 1950s-style illustrated subway map of the city" />
          </div>
        </div>
        <div class="map-actions" id="mapActions">
          <button id="subwayMapBtn">🚇 Generate 1950s Subway Map (via fal)</button>
          <span class="map-action-status" id="subwayMapStatus"></span>
          <button id="subwayMapHideBtn" style="display:none">Hide Subway Map</button>
        </div>
      </div>
    </div>
  </main>
</div>
