<div class="tab-panel" data-tab-panel="map">
  <div class="toolbar">
    <div class="status-pill" id="historyStatusPill"><span class="dot"></span><span id="historyStatusText">idle</span></div>
    <div class="status-pill" id="agentsStatusPill"><span class="dot"></span><span id="agentsStatusText">idle</span></div>
    <div class="error-msg" id="historyErrorMsg"></div>
    <div class="error-msg" id="agentsErrorMsg"></div>
    <div class="spacer"></div>
    <button class="danger" id="stopBtn" style="display:none">■ Stop</button>
    <button id="startBtn">▶ Start Agents</button>
    <button class="danger" id="deleteCityBtn" style="display:none">🗑 Delete City</button>
    <button class="primary" id="generateBtn">▶ Generate</button>
  </div>

  <main>
    <div class="empty" id="historyEmpty">Hit <b>Generate</b> to build a city.</div>

    <div id="historyContent" style="display:none">
      <header class="masthead-inline">
        <h2>Chronicle of the City</h2>
        <div class="subtitle" id="citySubtitle"></div>
        <div class="stats" id="cityStats"></div>
      </header>

      <section class="agent-log-panel" id="agentLogColumn">
        <div class="label">Agent Activity Log</div>
        <div class="agent-log" id="agentLogHistory"></div>
        <div class="agent-log" id="agentLogLive"></div>
      </section>

      <section class="residents-section" id="residentsSection" style="display:none">
        <div class="section-header">
          <div>
            <h2>Residents of the City, c. 1959</h2>
            <div class="desc">People living here today, each grounded in a piece of the city's history -- generate one whenever you like.</div>
          </div>
          <button id="generateCharacterBtn">+ Generate Character</button>
        </div>
        <div class="resident-grid" id="residentGrid"></div>
      </section>
    </div>
  </main>
</div>
