  # --- homes
  Brownstone/Townhouse: [antebellum, gilded_age]
  Tenement/Residence: [antebellum, gilded_age, progressive, prohibition]
  Apartment House: [prohibition, depression_war]
  Housing Project: [depression_war]

  # --- civic life
  Church/House of Worship: null
  School: null
  Park/Public Square: null
  Government/Civic Building: null
  Fort/Garrison: [dutch_colonial, english_colonial]
