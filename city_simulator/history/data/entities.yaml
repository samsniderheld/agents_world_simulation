# Recurring thematic motifs assigned to a Figure at creation (Qud's
# fire/ice "domain") -- inherited by any Place they found, coloring that
# place's language for its whole history even after ownership changes.
# Keyed by era id so a figure's domain always reflects what that era was
# actually about (the fur trade in New Amsterdam, bootlegging in the Jazz
# Age) instead of one flat list shared across all 330 years -- see
# entities.py's domains_for_era().
