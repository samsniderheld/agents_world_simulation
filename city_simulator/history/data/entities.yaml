# place_type -> list of valid era ids, or null for "any era"
place_types:
  # Which eras a place of this type can be *founded* in (null = any era). A
  # place founded earlier can still stand in a later era -- a 1720 general
  # store can survive into the 1950s as an old establishment; this only
  # decides what's newly opened when. Era ids: dutch_colonial 1624-64,
  # english_colonial 1664-1783, early_republic 1783-1825, antebellum
  # 1825-61, gilded_age 1861-1900, progressive 1900-17, prohibition
  # 1920-33, depression_war 1933-59.

  # --- drink, food, lodging
  Tavern/Bar: [dutch_colonial, english_colonial, early_republic, antebellum, gilded_age, progressive, depression_war]
  Inn: [dutch_colonial, english_colonial]
  Coffee House: [english_colonial, early_republic]
  Speakeasy: [prohibition]
  Cocktail Lounge: [depression_war]
  Brewery: [dutch_colonial, english_colonial, early_republic, antebellum, gilded_age, progressive, depression_war]
  Restaurant: [antebellum, gilded_age, progressive, prohibition, depression_war]
  Diner/Automat: [progressive, prohibition, depression_war]
  Hotel/Boarding House: [early_republic, antebellum, gilded_age, progressive, prohibition, depression_war]

  # --- trade and shops
  Trading Post: [dutch_colonial, english_colonial]
  General Store/Shop: [dutch_colonial, english_colonial, early_republic, antebellum]
  Grocery/Corner Store: [gilded_age, progressive, prohibition, depression_war]
  Supermarket: [depression_war]
  Market: null
  Department Store: [gilded_age, progressive, prohibition, depression_war]
  Pawnshop: [antebellum, gilded_age, progressive, prohibition, depression_war]
  Garage/Filling Station: [prohibition, depression_war]

  # --- work and money
  Craftsman's Workshop: [dutch_colonial, english_colonial, early_republic, antebellum]
  Factory/Mill: [antebellum, gilded_age, progressive, prohibition, depression_war]
  Shipyard/Dock/Warehouse: null
  Bank/Counting House: null
  Union Hall: [gilded_age, progressive, prohibition, depression_war]
  Newspaper/Print Shop: [english_colonial, early_republic, antebellum, gilded_age, progressive, prohibition, depression_war]
  Radio Station: [prohibition, depression_war]

  # --- entertainment and vice
  Theater/Hall: [early_republic, antebellum, gilded_age, progressive, prohibition, depression_war]
