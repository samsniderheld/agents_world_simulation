# Free-prose hints handed to the LLM (loose instructions, not filled-in
# sentences) describing a resident's relationship to their grounding place.
relationship_hints:
  active:
    - "a descendant of the founder, who still runs the place today"
    - "the current owner, unrelated by blood but a little obsessed with its history"
    - "a longtime employee who knows every story the walls could tell"
    - "a regular who has practically lived there for decades"
    - "a former rival owner who bought in rather than lose out entirely"
    - "the bartender who's poured drinks there since before most of the regulars were born"
    - "a silent partner who never wanted their name on the sign"
    - "the founder's estranged relative, back in town and trying to make peace with the place"
    - "someone who won a stake in the place in a card game and never left"
    - "the cook who's been in the kitchen so long the recipes are unofficially theirs"
    - "a former employee who bought out the owner when they retired"
    - "the neighborhood fixture who treats the place like a second home"
    - "a distant cousin of the founder who showed up one day and simply stayed"
    - "the one who remembers every regular's order and most of their secrets"
  gone:
    - "a descendant of the founder, who never quite got over losing it"
    - "someone who grew up on family stories about the place, told long after it was gone"
    - "a local historian fixated on what the place used to be"
    - "an old-timer who still tells stories about it to anyone who'll listen"
    - "the last employee to lock up before it closed for good"
    - "someone who still walks past the empty lot out of habit"
    - "a former regular who never found anywhere quite like it again"
    - "the founder's grandchild, raised on stories of a place they never saw standing"
    - "someone who keeps a photograph of it on their wall"
    - "the one who tried and failed to save it from closing"
    - "a former rival who somehow misses it more than anyone expected"
    - "someone who still refers to the block by its old name"
    - "the last person to hold a key to a door that no longer exists"
    - "someone who blames themselves, fairly or not, for what happened to it"

# Fallback (no-LLM) bio sentences -- separate pools per (place still
# standing vs. gone) x (a founder exists to reference or not), each a
# complete sentence with {name}/{place}/{founder} slots, unlike the free
# prose hints above which only need to work as loose LLM instructions. Kept
# as four separate pools (rather than one generic template) so a "no blood
# relation" hint can never get a contradictory "descended from" clause
# spliced into it, and {place} never dangles awkwardly at a sentence's end.
bio_templates:
  active_with_founder:
    - "{name}, descended from {founder}, still runs {place} to this day."
    - >-
      {name} owns {place} now -- no blood relation to {founder}, the
      original founder, but you would never know it from how they talk
      about the place.
    - "{name} took over from {founder} years ago and has run {place} exactly the same way ever since."
    - "{name} never met {founder}, but keeps their photograph behind the counter at {place} all the same."
    - "{name} married into the family that founded {place}, and stayed long after {founder} was gone."
    - "{name} was handed the keys to {place} by {founder} personally, with a single word of advice."
    - "{name} bought {place} from {founder}'s estate and refuses to change a single fixture."
    - "{name} apprenticed under {founder} at {place} and never left."
    - "{name} is {founder}'s great-nephew, and the only one in the family who still wanted {place}."
    - "{name} inherited {place} from {founder} along with debts nobody mentioned until later."
    - "{name} promised {founder} on their deathbed that {place} would never close, and it hasn't."
    - "{name} was {founder}'s rival for years before ending up as the one who kept {place} alive."
  active_no_founder:
    - "{name} has worked at {place} so long that half the neighborhood assumes they own it."
    - "{name} has been a regular at {place} for as long as anyone can remember."
    - "{name} started sweeping the floors at {place} as a kid and simply never stopped coming back."
    - "{name} moved to the neighborhood specifically to be closer to {place}."
    - "{name} has a permanent seat at {place} that everyone knows better than to take."
    - "{name} took over {place} sight unseen and has never regretted it."
    - "{name} treats {place} like an office, a living room, and a confessional all at once."
    - "{name} has kept {place} running through more hard years than they like to count."
    - "{name} learned the trade at {place} and never saw a reason to work anywhere else."
    - "{name} shows up at {place} so reliably that the staff set their clocks by it."
    - "{name} talks about {place} the way other people talk about family."
    - "{name} has quietly kept {place} afloat more than once, and never mentions it."
  gone_with_founder:
    - "{name}, descended from {founder}, never quite got over losing {place}."
    - "{name} grew up on family stories about {place}, stories that always started with {founder}."
    - "{name} was the last person {founder} trusted with the keys to {place}, for all the good it did."
    - "{name} still has the ledger {founder} kept at {place}, and can't bring themselves to throw it out."
    - "{name} watched {founder}'s life's work at {place} disappear and never quite forgave the city for it."
    - "{name} was {founder}'s apprentice at {place} right up until there was nothing left to apprentice at."
    - "{name} carries {founder}'s watch, the one thing salvaged from {place} before it closed."
    - "{name} promised {founder} they'd reopen {place} one day, and still means it."
    - "{name} was too young to know {founder}, but grew up hearing exactly what {place} meant to them."
    - "{name} blames themselves for not being there the night {place} went under, the same way {founder} once was."
    - "{name} kept {founder}'s old sign from {place} in a garage, waiting for a reason to hang it up again."
    - "{name} is the last living relative of {founder} who still talks about {place} like it's coming back."
  gone_no_founder:
    - "{name} is the closest thing the neighborhood has to a historian of {place}."
    - "{name} still tells stories about {place} to anyone who'll listen."
    - "{name} can point to the exact spot where {place} used to stand."
    - "{name} still has a matchbook from {place} tucked in a drawer somewhere."
    - "{name} was there the night {place} closed for good and has never quite gotten over it."
    - "{name} keeps a scrapbook of newspaper clippings about {place}, just in case anyone asks."
    - "{name} can recite the entire layout of {place} from memory, decades on."
    - "{name} still meets old friends near where {place} used to be, out of habit more than anything."
    - "{name} was practically raised inside {place} before it disappeared."
    - "{name} has never quite trusted whatever replaced {place} on that corner."
    - "{name} can tell you exactly what {place} smelled like, if you ask."
    - "{name} still marks the anniversary of the day {place} closed."
