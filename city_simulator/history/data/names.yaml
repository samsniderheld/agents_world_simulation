# Pure-grammar word lists, grouped by rough time period rather than
# duplicated per era -- era_name_groups below maps each era onto one of
# these groups.
name_groups:
  dutch:
    given: [Jan, Pieter, Willem, Cornelis, Hendrick, Anneke, Griet, Marritje, Trijntje, Aeltje,
            Dirk, Jacob, Barent, Gerrit, Claes, Femmetje, Geertruyd, Lysbeth, Neeltje, Styntje]
    surname: ["Van der Berg", "De Groot", Bogaert, "Van Dyck", Kuyper, Stuyvesant, Verplanck, Rutgers,
              "Van Wyck", "De Witt", "Van Cortlandt", "Ten Eyck", "Van Der Donck", Schuyler, Brouwer,
              "Van Zandt", "De Peyster", Bleecker]
  english:
    given: [William, John, Thomas, Samuel, Elizabeth, Margaret, Abigail, Josiah, Nathaniel, Prudence,
            Benjamin, Richard, Edward, Charles, Hannah, Sarah, Mercy, Increase, Jonathan, Deborah]
    surname: [Beekman, Livingston, Morris, Hamilton, Bayard, Fish, Roosevelt, Whitfield,
              "Van Rensselaer", Clinton, Duane, Jay, Schermerhorn, Rhinelander, Cruger, Waddington,
              Ludlow, Pell]
  "19c":
    given: [Patrick, Seamus, Bridget, Katharina, Heinrich, Mary, Michael, Anna, Cornelius, Delia,
            Liam, Fiona, Wilhelm, Greta, Sean, Kathleen, Otto, Margarethe, Declan, Aoife]
    surname: ["O'Malley", Schmidt, Muller, Fitzgerald, Costello, Weber, Doyle, Kessler,
              Kelly, Braun, Sullivan, Hoffmann, Byrne, Krueger, Flanagan, Zimmerman, Casey, Wagner]
  "20c":
    given: [Rose, Sal, Frank, Dorothy, Irving, Ruth, Vincent, Gloria, Moe, Sadie,
            Tony, Esther, Nick, Pearl, Sam, Angela, Murray, Lucille, Benny, Fannie]
    surname: [Russo, Cohen, Bianchi, Kowalski, Moretti, Feldman, Lombardi, Sullivan,
              Greco, Silverman, Marino, Novak, Rizzo, Katz, Romano, Walsh, Esposito, Goldstein]

# era id -> which name_groups entry it draws from. An era with no entry
# here falls back to "english" (see names.py's _names_for_era).
era_name_groups:
  dutch_colonial: dutch
  english_colonial: english
  early_republic: english
  antebellum: "19c"
  gilded_age: "19c"
  progressive: "20c"
  prohibition: "20c"
  depression_war: "20c"

