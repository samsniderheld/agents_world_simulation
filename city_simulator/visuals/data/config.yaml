# Which provider implementation backs the Visuals tab (see
# visuals/providers/__init__.py's get_provider()): "fal", "local" (Diffusers
# on Apple Silicon) or "comfyui" (a ComfyUI server -- see the comfyui section
# below). VISUALS_PROVIDER in .env overrides this; routes.py/jobs.py/the
# frontend never change.
provider: fal

fal:
  text_to_image_model: "fal-ai/gemini-3-pro-image-preview"
  image_edit_model: "fal-ai/gemini-3-pro-image-preview/edit"
  image_to_video_model: "google/gemini-omni-flash/v1.1/image-to-video"
  # Confirmed via fal's own OpenAPI schema that google/gemini-omni-flash/edit
  # (and its v1.1) take ONLY prompt + video_url -- no reference-image field
  # exists on that endpoint despite the name. reference-to-video is the
  # actual model that combines a reference video + reference image(s) +
  # prompt; it generates a new video from those references rather than
  # editing the upload in place, and any reference_video_urls entry is
  # capped by fal at 3 seconds.
  reference_to_video_model: "google/gemini-omni-flash/v1.1/reference-to-video"
  # Google Lyria 2 -- text-to-music, 48kHz WAV, ~30s clips. Confirmed via
  # fal's own API docs (fal.ai/models/fal-ai/lyria2/api): takes just
  # prompt/negative_prompt/seed, returns {"audio": {url, ...}} -- no
  # image/video-style aspect_ratio or resolution options to default here.
  music_model: "fal-ai/lyria2"
  poll_interval_seconds: 2
  timeout_seconds: 600

image_defaults:
  aspect_ratio: "16:9"
  resolution: "1K"
  output_format: "png"

video_defaults:
  aspect_ratio: "16:9"
  resolution: "720p"
  duration: 8

video_reference_defaults:
  aspect_ratio: "16:9"
  resolution: "720p"
  duration: 8

# Local text-to-image generation (Hugging Face Diffusers on PyTorch MPS).
# See visuals/NOTES.md for why only Z-Image Turbo is wired up (FLUX.2
# [klein] and Qwen-Image were researched and are not implemented -- one's
# blocked on tooling, the other's requested variant doesn't exist; see
# that file before changing model_id here).
local:
  model_id: "Tongyi-MAI/Z-Image-Turbo"
  num_inference_steps: 9
  guidance_scale: 0.0
  # SDNQ post-load quantization of the transformer + text encoder --
  # meaningful memory headroom for a small quality cost. See NOTES.md for
  # why this needs the standalone sdnq_post_load_quant() call rather than
  # diffusers' native quantization_config= (that needs diffusers>=0.40.0;
  # we're on 0.36.0).
  quantize: true
  quantize_dtype: "int8"

# ComfyUI (visuals/providers/comfyui.py): every image generate/edit runs an
# API-format workflow (ComfyUI's "Export (API)") on the ComfyUI server at
# COMFYUI_URL (.env) -- e.g. a RunPod pod set up with deploy/runpod-comfyui/.
# Images only; video and music still go through fal.
#
# Image inputs are found automatically: every LoadImage node in the workflow
# is a placeholder, and each numbered input fed from one ("images.image_1",
# "images.image_2" / "images.image0", "images.image1" ...) is grown or shrunk
# to however many images the node sent (up to max_images), keeping its own
# numbering. Nodes that don't feed the output (e.g. a Compare node) are dropped.
#
# The rest is named as "<node id>.<input name>":
#   prompt          inputs that get the prompt text
#   seed            inputs that get a fresh random seed each call
#   size            an EmptyLatentImage-style node: width/height from the aspect ratio
#   output          the node whose images are the result
#   without_images  overrides for text-to-image (no images sent); "{prompt}"
#                   is replaced by the prompt
comfyui:
  timeout_seconds: 900
  poll_interval_seconds: 1
  image_workflow:
    # ComfyUI's Qwen-Image 2.1 image-edit template (needs ComfyUI >= 0.37.0
    # and its four models -- deploy/runpod-comfyui/setup.sh installs both).
    file: "comfyui/qwen_image_2_1_edit.json"
    # The template takes up to 10; image 1 is the one edited. Extra images
    # are left off the end (the frontend sends a node's input images first,
    # then style references, then wired agents'/places' pictures).
    max_images: 4
    prompt: ["459:500.prompt", "459:484.on_false"]
    seed: ["459:458.seed", "459:500.sampling_mode.seed"]
    size: "459:456"
    output: "461"
    without_images:
      # skip the edit prompt-enhancer (it needs an image) ...
      "459:474.prompt": "{prompt}"
      # ... and start from the empty latent instead of the input image
      "459:468.switch": true
    sizes:
      "1:1": [1328, 1328]
      "16:9": [1664, 928]
      "9:16": [928, 1664]

