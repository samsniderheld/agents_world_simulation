# Which provider makes images and video (see visuals/providers/__init__.py):
# "fal", "local" (Diffusers on Apple Silicon, images only) or "comfyui" (a
# ComfyUI server -- see the comfyui section below). `provider` is the default
# for both; image_provider / video_provider set one kind. In .env,
# VISUALS_PROVIDER / VISUALS_IMAGE_PROVIDER / VISUALS_VIDEO_PROVIDER override
# these, and an Image or Video node can pick a different one per node.
# Music always uses fal.
provider: fal
# image_provider: comfyui
# video_provider: comfyui

fal:
  text_to_image_model: "fal-ai/gemini-3-pro-image-preview"
  image_edit_model: "fal-ai/gemini-3-pro-image-preview/edit"
  image_to_video_model: "google/gemini-omni-flash/v1.1/image-to-video"
  # Confirmed via fal's own OpenAPI schema that google/gemini-omni-flash/edit
  # (and its v1.1) take ONLY prompt + video_url -- no reference-image field
  # exists on that endpoint despite the name. reference-to-video is the
  # actual model that combines a reference video + reference image(s) +
  # prompt; it generates a new video from those references rather than
  # editing the upload in place, and any reference_video_urls entry is
  # capped by fal at 3 seconds.
  reference_to_video_model: "google/gemini-omni-flash/v1.1/reference-to-video"
  # Google Lyria 2 -- text-to-music, 48kHz WAV, ~30s clips. Confirmed via
  # fal's own API docs (fal.ai/models/fal-ai/lyria2/api): takes just
  # prompt/negative_prompt/seed, returns {"audio": {url, ...}} -- no
  # image/video-style aspect_ratio or resolution options to default here.
  music_model: "fal-ai/lyria2"
  poll_interval_seconds: 2
  timeout_seconds: 600

image_defaults:
  aspect_ratio: "16:9"
  resolution: "1K"
  output_format: "png"

video_defaults:
  aspect_ratio: "16:9"
  resolution: "720p"
  duration: 8

video_reference_defaults:
  aspect_ratio: "16:9"
  resolution: "720p"
  duration: 8

# Local text-to-image generation (Hugging Face Diffusers on PyTorch MPS).
# See visuals/NOTES.md for why only Z-Image Turbo is wired up (FLUX.2
# [klein] and Qwen-Image were researched and are not implemented -- one's
# blocked on tooling, the other's requested variant doesn't exist; see
# that file before changing model_id here).
local:
  model_id: "Tongyi-MAI/Z-Image-Turbo"
  num_inference_steps: 9
  guidance_scale: 0.0
  # SDNQ post-load quantization of the transformer + text encoder --
  # meaningful memory headroom for a small quality cost. See NOTES.md for
  # why this needs the standalone sdnq_post_load_quant() call rather than
  # diffusers' native quantization_config= (that needs diffusers>=0.40.0;
  # we're on 0.36.0).
  quantize: true
  quantize_dtype: "int8"

# ComfyUI (visuals/providers/comfyui.py): every image generate/edit and every
# video runs an API-format workflow (ComfyUI's "Export (API)") on a ComfyUI
# server -- images on COMFYUI_IMAGE_URL, video on COMFYUI_VIDEO_URL (.env; both
# default to COMFYUI_URL), e.g. RunPod pods set up with deploy/runpod-comfyui/.
# Music still goes through fal.
#
# Image inputs are found automatically: every LoadImage node in the workflow
# is a placeholder, and each numbered input fed from one ("images.image_1",
# "images.image_2" / "images.image0", "images.image1" ...) is grown or shrunk
# to however many images the node sent (up to max_images), keeping its own
# numbering. Nodes that don't feed the output (e.g. a Compare node) are dropped.
#
# The rest is named as "<node id>.<input name>":
#   prompt          inputs that get the prompt text
#   seed            inputs that get a fresh random seed each call
#   size            an EmptyLatentImage-style node: its width/height become
#                   the node's aspect ratio at the chosen resolution
#   resolution      an input that gets the resolution's pixel budget
#                   (resolutions: the Image node's 1K / 2K -> that budget)
#   output          the node whose images are the result
#   with_images     overrides when images are sent
#   without_images  overrides for text-to-image (no images sent); "{prompt}"
#                   is replaced by the prompt
#   aspect_ratio    (video) an input that gets the node's aspect ratio, named
#                   as aspect_ratios maps it ("16:9" -> that input's value)
#   options         (video) the Video node's options -> the inputs they set:
#                   duration (seconds), megapixels, steps, sampler, scheduler;
#                   defaults gives each one's value when the node leaves it blank
#   set             fixed values to set on every call (e.g. a different model file)
comfyui:
  timeout_seconds: 900
  poll_interval_seconds: 1
  image_workflow:
    # ComfyUI's Qwen-Image 2.1 image-edit template (needs ComfyUI >= 0.37.0
    # and its four models -- deploy/runpod-comfyui/setup.sh installs both).
    file: "comfyui/qwen_image_2_1_edit.json"
    # The template takes up to 10; image 1 is the one edited. Extra images
    # are left off the end (the frontend sends a node's input images first,
    # then style references, then wired agents'/places' pictures).
    max_images: 4
    prompt: ["459:500.prompt", "459:484.on_false"]
    seed: ["459:458.seed", "459:500.sampling_mode.seed"]
    size: "459:456"
    # reference images are resized to about this many pixels squared
    resolution: "459:474.resolution"
    resolutions: {"1K": 1024, "2K": 2048}
    output: "461"
    with_images:
      # "custom size": the canvas is the node's aspect ratio and resolution,
      # not image 1's own size
      "459:468.switch": true
      # the prompt goes to the image model as written; the template's Qwen3.5
      # prompt enhancer (TextGenerate, "refine prompt" -- off in ComfyUI's own
      # template) is skipped: it's slow, and its fused DeltaNet kernel fails
      # on some setups ("deltanet_conv_step launch rejected"). Delete this
      # line to turn the enhancer back on.
      "459:474.prompt": "{prompt}"
    without_images:
      # skip the edit prompt-enhancer (it needs an image) ...
      "459:474.prompt": "{prompt}"
      # ... and start from the empty latent instead of the input image
      "459:468.switch": true

  video_workflow:
    # ComfyUI's MiniMax H3 image-to-video template (video with sound; needs
    # its four models -- `deploy/runpod-comfyui/setup.sh video` downloads them).
    # The Video node's source image becomes the first frame.
    file: "comfyui/minimax_h3_i2v.json"
    max_images: 1
    timeout_seconds: 1800
    prompt: ["105:104.prompt"]
    seed: ["105:15.noise_seed"]
    output: "92"
    aspect_ratio: "115.aspect_ratio"
    aspect_ratios:
      "16:9": "16:9 (Widescreen)"
      "9:16": "9:16 (Portrait Widescreen)"
      "1:1": "1:1 (Square)"
    options:
      duration: "105:111.value"         # seconds; the workflow turns it into frames at 24 fps
      megapixels: "115.megapixels"      # with the aspect ratio: 0.4 = 864x480 at 16:9
      steps: "105:9.steps"
      sampler: "105:17.sampler_name"
      scheduler: "105:9.scheduler"
    defaults:
      duration: 5                       # MiniMax H3 is trained on ~5-15 s clips
    # The workflow's text encoder is NVFP4 (made for Blackwell GPUs). If it
    # won't load on the video pod's GPU, use the int8 one instead -- run
    # `MINIMAX_TEXT_ENCODER=int8 setup.sh video` on the pod and uncomment:
    # set:
    #   "105:13.clip_name": "qwen3vl_32b_minimax_h3_int8_convrot.safetensors"
