# Which provider implementation backs the Visuals tab (see
# visuals/providers/__init__.py's get_provider()). "fal" today; adding a
# "local" entry here (once visuals/providers/local.py exists) is the whole
# story for switching to a local model server -- routes.py/jobs.py/the
# frontend never change.
provider: fal

fal:
  text_to_image_model: "fal-ai/gemini-3-pro-image-preview"
  image_edit_model: "fal-ai/gemini-3-pro-image-preview/edit"
  image_to_video_model: "google/gemini-omni-flash/v1.1/image-to-video"
  # Confirmed via fal's own OpenAPI schema that google/gemini-omni-flash/edit
  # (and its v1.1) take ONLY prompt + video_url -- no reference-image field
  # exists on that endpoint despite the name. reference-to-video is the
  # actual model that combines a reference video + reference image(s) +
  # prompt; it generates a new video from those references rather than
  # editing the upload in place, and any reference_video_urls entry is
  # capped by fal at 3 seconds.
  reference_to_video_model: "google/gemini-omni-flash/v1.1/reference-to-video"
  poll_interval_seconds: 2
  timeout_seconds: 600

image_defaults:
  aspect_ratio: "1:1"
  resolution: "1K"
  output_format: "png"

video_defaults:
  aspect_ratio: "16:9"
  resolution: "720p"
  duration: 8

video_reference_defaults:
  aspect_ratio: "16:9"
  resolution: "720p"
  duration: 8

# Local text-to-image generation (Hugging Face Diffusers on PyTorch MPS).
# See visuals/NOTES.md for why only Z-Image Turbo is wired up (FLUX.2
# [klein] and Qwen-Image were researched and are not implemented -- one's
# blocked on tooling, the other's requested variant doesn't exist; see
# that file before changing model_id here).
local:
  model_id: "Tongyi-MAI/Z-Image-Turbo"
  num_inference_steps: 9
  guidance_scale: 0.0
  # SDNQ post-load quantization of the transformer + text encoder --
  # meaningful memory headroom for a small quality cost. See NOTES.md for
  # why this needs the standalone sdnq_post_load_quant() call rather than
  # diffusers' native quantization_config= (that needs diffusers>=0.40.0;
  # we're on 0.36.0).
  quantize: true
  quantize_dtype: "int8"

# The History tab's "1950s subway map" option (visuals/subway_map.py):
# the generated history's ASCII map gets rendered to a plain image and
# handed to fal's image-edit model (always fal -- this needs real
# image-in/image-out editing, which the local provider doesn't support)
# along with a real vintage map as a style reference.
subway_map:
  render_font_size: 14
  render_padding: 24
  # image_paths[0] (built at generate time) is the rendered ASCII map --
  # the exact layout/labels to preserve. image_paths[1], below, is a real
  # 1950s NYC subway/tourist map, provided purely as a style reference --
  # resolved relative to the project root (city_simulator/).
  style_reference_image: "history/map_ref.jpg"
  prompt: >
    You are given two reference images. The first is a plain rendering of
    a fictional city's map: numbered place labels, neighborhood names, a
    coastline, and river labels. The second is an authentic 1950s New York
    City subway and tourist map, provided ONLY as a style reference.
    Redraw the FIRST image's map in the illustration style of the SECOND:
    the same muted mid-century color palette, hand-lettered typography, a
    bordered legend box, and yellow-street/teal-water transit-map look.
    Preserve the first image's numbered place labels exactly as shown, in
    their same relative positions, its neighborhood names, and its overall
    coastline/land shape and river labels. Do not invent additional
    numbered labels beyond the ones shown, and do not copy the second
    image's actual streets, place names, or geography -- only its
    illustration style.

