# A city theme: the free city of Aldermere, a high-fantasy river city.
#
# Same structure as themes/noir_nyc.yaml (see its header and comments for what
# each section does). Copy this file, change the world, and upload it on the
# Cities screen to generate cities in a world of your own.

theme:
  id: fantasy_realm
  name: 'Fantasy: the free city of Aldermere'
  description: A walled river city of guilds, temples and wizards' towers, from its founding in the year 1000 to
    an uneasy peace in 1312.

world:
  present_year: 1312
  visual_look: 'painterly high-fantasy illustration: warm candlelit interiors, misty cobbled lanes, rich jewel-tone
    color, dramatic chiaroscuro, medieval wardrobe and production design, rendered like a classic oil painting.'

eras:
- id: founding
  name: The Founding (Age of Stakes)
  start_year: 1000
  end_year: 1060
  description: Settlers drive the first palisade stakes where the River Alder meets the sea.
- id: river_kings
  name: The River Kings
  start_year: 1060
  end_year: 1130
  description: Petty lords tax every barge and build the first stone keep over the ford.
- id: guild_wars
  name: The Guild Wars
  start_year: 1130
  end_year: 1180
  description: Merchant guilds break the lords' hold on the city, street by street.
- id: grey_plague
  name: The Grey Plague
  start_year: 1180
  end_year: 1210
  description: A wasting sickness empties whole quarters; the temples and the healers rise in power.
- id: mage_council
  name: The Mage Council
  start_year: 1210
  end_year: 1265
  description: Wizards take seats beside the guildmasters, and towers climb above the rooftops.
- id: uneasy_peace
  name: The Uneasy Peace
  start_year: 1265
  end_year: 1312
  description: Trade booms, old feuds simmer, and every faction keeps a dagger under the table.

