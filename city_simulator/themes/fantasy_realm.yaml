prompts:
  history:
    figure_name: Give one plausible full person name (first and last) for a {role} living in the free city of Aldermere
      during {era_name} (roughly {era_start}-{era_end}). Reply with ONLY the name, nothing else -- no titles, no
      explanation.
    figure_name_no_era: Give one plausible full person name for a {role} in the free city of Aldermere. Reply with
      ONLY the name, nothing else -- no titles, no explanation.
    place_name: Give one short, fitting medieval-fantasy place name for a {place_type} in the free city of Aldermere
      around {year}, founded by someone surnamed {surname}, thematically associated with "{domain}". Reply with
      ONLY the name, nothing else.
    event_flourish: |-
      Rewrite the following sentence describing a historical event in the free city of Aldermere so it reads as slightly more vivid, chronicle-flavored prose. Keep every proper noun, name, date, and fact EXACTLY as given -- do not invent or remove any of them, and keep it to one sentence. Reply with ONLY the rewritten sentence.

      Sentence: {text}
    architecture: Describe, in exactly one vivid sentence, the architecture and physical appearance of a {place_noun}
      in the free city of Aldermere, built during the "{era_name}" era ({era_start}-{era_end}). The dominant architectural
      style of that era is {style}. Reference fitting, believable materials and details, sized appropriately for
      a {place_noun} specifically -- not a mansion or a monument, unless that's genuinely what a {place_noun} would
      be. Reply with ONLY the sentence, no preamble.
    architecture_fallback_building: '{scale}, {adjective} and built of {material}, notable for {feature}.'
    architecture_fallback_landscape: '{scale}, laid out in a {adjective} {style} taste, with {feature}.'
    summary: |-
      You are the city's chronicler, writing the opening passage of a chronicle of the free city of Aldermere, from its founding by the river to the present day. Below is the complete chronological record of everything that happened there -- every founding, fire, feud, scandal, and death.

