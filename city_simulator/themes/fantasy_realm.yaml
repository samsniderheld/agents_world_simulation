events:
  generic_causes:
  - a matter of {domain}
  - reasons the old chronicles leave unclear
  - a dispute no one now remembers clearly
  - an old grudge nobody could quite explain
  - a matter tied up with {domain} somehow
  - coin that changed hands more than once
  - a prophecy someone took too seriously
  - an oath sworn in anger
  - what the omens seemed to say
  - a debt from the Guild Wars
  - a quarrel over {domain}
  - a bargain struck at midnight
  - a slight at a feast
  - something whispered in the temple
  disasters:
  - fire
  - a flood
  - a riot
  - the Grey Plague
  - a dragon's passing
  - a collapsed cellar
  - a lightning storm
  - a spell gone wrong
  - a siege
  - an earth tremor
  - a guild war barricade
  - the river breaking its banks
  - a winter of famine
  - a curse, or so people said
  scandal_tags:
  - bribery
  - smuggling
  - forgery
  - poisoning rumors
  - debts to the Thief-Lords
  - heresy
  - a secret marriage
  - short-weighting
  - trafficking in forbidden books
  - a broken oath
  - cheating at dice
  - selling false relics
  - consorting with a rival guild
  - blackmail
  - a duel at dawn
  - unlicensed spellcraft
  political_outcomes:
  - a night in the stocks
  - a heavy fine
  - a public apology
  - quiet exile from the quarter
  - the loss of a guild seal
  - a flogging in the square
  - a transfer to the far garrison
  - a pilgrimage of penance
  - a year banished beyond the walls
  - a seat lost on the Council
  - a rumor that never reached the herald
  - nothing at all, somehow
  - a stern word from the magistrate
  - a forfeited dowry
  - a brand on the hand
  notable_template_ids:
  - found_place
  - place_destroyed
  - rebuilt_place
  - expansion
  event_templates:
  - id: found_place
    requires_place: new
    effects: found_place
    grammar:
      TEXT:
      - In {year}, {figure} of {domain} founded {place}, a {place_noun}, {founding_flourish}.
      - '{figure} opened the doors of {place} in {year}, a {place_noun} that would carry the mark of {domain} for
        years to come.'
      - '{figure} laid the first stone of {place} in {year}, {founding_flourish}.'
      - '{place} first first opened its doors in {year}, {figure}''s answer to {domain}.'
      - By {year}, {figure} had turned a notion into {place}, a new {place_noun} {founding_flourish}.
      - '{figure} christened {place} in {year}, a {place_noun} built {founding_flourish}.'
      - In {year}, what would become {place} started as little more than {figure}'s idea, {founding_flourish}.
      - '{figure} threw open the doors of {place}, a {place_noun}, {founding_flourish}, in {year}.'
      - '{place} owes its start to {figure}, who founded it in {year} {founding_flourish}.'
      - '{figure} staked everything on {place} in {year}, a {place_noun} devoted to {domain}.'
      - The {place_noun} known as {place} began, in {year}, as {figure}'s gamble on {domain}.
      - '{figure} broke ground on {place} in {year}, {founding_flourish}.'
      founding_flourish:
      - on a corner that was then little more than mud and ambition
      - with borrowed money and a great deal of nerve
      - in the shadow of the harbor
      - on ground still remembered as farmland
      - against the advice of everyone who knew better
      - with nothing but a lease and good timing
      - after years of saving every spare cent
      - on the strength of a single good idea
      - in a building nobody else wanted
      - with a partner who didn't last the year
      - using money that wasn't entirely their own
      - on a lane that hadn't yet found its name
      - with more hope than capital
      - in the space where a failed venture had stood before
  - id: expansion
    requires_place: new
    effects: expansion
    precondition: has_founded_a_place
    grammar:
      TEXT:
      - Flush with earlier success, {figure} opened a second {place_noun}, {place}, in {year}.
      - By {year}, {figure}'s ambitions had outgrown one address; {place}, a new {place_noun}, followed.
      - '{figure} couldn''t resist opening a second location, {place}, in {year}.'
      - 'In {year}, {figure} bet on a second {place_noun}: {place}.'
      - One {place_noun} wasn't enough for {figure}, who opened {place} in {year}.
      - '{figure} expanded into {place}, a new {place_noun}, by {year}.'
      - Success bred more success in {year}, when {figure} opened {place}.
      - '{figure} doubled down in {year}, adding {place} to what they already had.'
      - 'By {year}, {figure} had a second {place_noun} to their name: {place}.'
      - '{place} was {figure}''s attempt to repeat what had already worked, opened in {year}.'
      - '{figure} took the profits from one venture and sank them into {place} in {year}.'
      - In {year}, {figure} answered demand the only way they knew how -- with {place}, a second {place_noun}.
  - id: place_destroyed
    requires_place: existing
    place_filter: active_place
    effects: place_destroyed
    grammar:
      TEXT:
      - In {year}, {place} was lost to {disaster}; some blamed {cause}.
      - '{place} was consumed by {disaster} in {year}, leaving little of what {figure} had built there.'
      - '{place} did not survive {year}''s {disaster}.'
      - '{figure} watched {place} go down to {disaster} in {year}, and blamed {cause}.'
      - By {year}, {disaster} had taken {place}, the {place_noun} {figure} had built.
      - '{place} was gone by {year}, undone by {disaster}.'
      - In {year}, {disaster} left nothing standing of {place}.
      - The {place_noun} called {place} met its end in {year}'s {disaster}.
      - '{figure}''s {place_noun}, {place}, fell to {disaster} in {year} -- some pointed to {cause}.'
      - '{place} was reduced to nothing by {disaster} in {year}.'
      - After {disaster} struck in {year}, {place} never reopened.
      - '{year} was the year {disaster} finally caught up with {place}.'
  - id: rebuilt_place
    requires_place: existing
    place_filter: destroyed_place
    effects: rebuilt_place
    grammar:
      TEXT:
      - '{figure} rebuilt {place} in {year}, raising it again as a {place_noun}.'
      - Where ashes had stood, {figure} raised {place} anew in {year}.
      - '{place} rose again in {year}, thanks to {figure}.'
      - '{figure} refused to let {place} stay closed, and rebuilt it by {year}.'
      - By {year}, {figure} had restored {place} to something like its old self.
      - '{place} reopened in {year}, rebuilt from the ground up by {figure}.'
      - '{figure} put everything into rebuilding {place}, finishing in {year}.'
      - In {year}, {place} returned, the {place_noun} {figure} wouldn't abandon.
      - '{figure} would not let {place} die, and reopened its doors in {year}.'
      - The {place_noun} known as {place} came back in {year}, rebuilt board by board.
      - '{place} was reborn in {year} under {figure}''s hand.'
      - '{figure} rebuilt {place} from nothing in {year}, out of stubbornness as much as anything.'
  - id: ownership_change
    requires_place: existing
    place_filter: active_place
    effects: ownership_change
    grammar:
      TEXT:
      - '{place}, the old {place_noun}, changed hands in {year} when {figure} took it over.'
      - In {year}, {figure} bought out the previous proprietor of {place}, citing {cause}.
      - '{figure} took over {place} in {year}, over {cause}.'
      - By {year}, {place} belonged to {figure}.
      - '{place} passed to {figure} in {year}, the latest in a line of owners.'
      - '{figure} won control of {place} in {year}, a story involving {cause}.'
      - 'The {place_noun} called {place} had a new owner by {year}: {figure}.'
      - '{figure} sealed the deed to {place} in {year}, citing {cause}.'
      - In {year}, {place} quietly changed hands, ending up with {figure}.
      - '{figure} acquired {place} in {year}, though the details involved {cause}.'
      - '{place} became {figure}''s in {year}, for reasons tied to {cause}.'
      - By {year}, {figure} had maneuvered their way into owning {place}.
  - id: renamed
    requires_place: existing
    place_filter: active_place
    effects: renamed
    grammar:
      TEXT:
      - '{figure} renamed the old {place_noun} -- once known as {old_name} -- to {place} in {year}.'
      - 'In {year}, {figure} gave the {place_noun} a new name: {place}, replacing {old_name}.'
      - '{old_name} became {place} in {year}, at {figure}''s insistence.'
      - '{figure} decided {old_name} no longer suited the place, and renamed it {place} in {year}.'
      - By {year}, the sign over the door read {place}, not {old_name}, thanks to {figure}.
      - '{figure} rechristened {old_name} as {place} in {year}.'
      - The {place_noun} once called {old_name} became {place} under {figure} in {year}.
      - '{year} saw {old_name} disappear, replaced by {figure}''s choice: {place}.'
      - '{figure} had little patience for {old_name}, and renamed it {place} in {year}.'
      - In {year}, {place} was born from what had been {old_name}, at {figure}'s hand.
      - '{figure} painted over {old_name} in {year}, and {place} took its place.'
  - id: alliance_formed
    requires_place: null
    effects: alliance_formed
    grammar:
      TEXT:
      - By {year}, {figure} had made fast friends with {faction}, a bond that would shape years to come.
      - '{figure} threw in with {faction} in {year}, for {domain}''s sake if nothing else.'
      - In {year}, {figure} and {faction} found common cause.
      - '{figure} allied with {faction} in {year}, a partnership neither would forget.'
      - By {year}, {figure} could count {faction} among their friends.
      - '{figure} struck a bargain with {faction} in {year} that would outlast the decade.'
      - '{year} marked the start of an understanding between {figure} and {faction}.'
      - '{figure} and {faction} became unlikely allies in {year}.'
      - In {year}, {figure} found a useful friend in {faction}.
      - '{figure} owed {faction} a favor after {year}, and both knew it.'
      - By {year}, {figure}'s fortunes were tied to {faction}'s goodwill.
      - '{figure} cast their lot with {faction} in {year}.'
  - id: rivalry_formed
    requires_place: null
    effects: rivalry_formed
    grammar:
      TEXT:
      - In {year}, {figure} earned the lasting enmity of {faction}.
      - '{figure} and {faction} became bitter rivals in {year}, over {domain} as much as anything else.'
      - By {year}, {figure} and {faction} were openly at odds.
      - '{figure} made an enemy of {faction} in {year}.'
      - '{year} marked the start of a feud between {figure} and {faction}.'
      - '{figure} crossed {faction} in {year}, and paid for it for years after.'
      - In {year}, {faction} decided {figure} was a problem worth solving.
      - '{figure} never forgave {faction} for what happened in {year}.'
      - By {year}, {figure} counted {faction} among their enemies.
      - '{figure} and {faction} traded grudges starting in {year}.'
      - '{year} was when {figure} first crossed swords with {faction}.'
      - '{figure} drew the lasting suspicion of {faction} in {year}.'
  - id: scandal
    requires_place: null
    effects: scandal
    grammar:
      TEXT:
      - Rumors of {tag} dogged {figure} from {year} onward, whispered to be over {cause}.
      - In {year}, whispers of {tag} began following {figure} everywhere.
      - '{figure}''s name became attached to {tag} in {year}, fairly or not.'
      - By {year}, half the quarter was talking about {figure} and {tag}.
      - '{year} brought {figure} a reputation for {tag} that never quite faded.'
      - Talk of {tag} trailed {figure} from {year} on, tied to {cause}.
      - '{figure} could not shake the talk of {tag} that started in {year}.'
      - In {year}, {figure} became a byword for {tag} in certain circles.
      - 'The rumors started in {year}: {figure}, and {tag}.'
      - '{figure}''s reputation never recovered after {year}''s talk of {tag}.'
      - By {year}, {tag} had become the word most often used alongside {figure}'s name.
  - id: political_trouble
    requires_place: null
    effects: political_trouble
    grammar:
      TEXT:
      - '{figure} was hauled before the magistrates in {year} over {cause}, and it ended in {outcome}.'
      - In {year}, {figure} found themselves answering questions about {cause}, which led to {outcome}.
      - '{figure} ran afoul of the law in {year} over {cause}; {outcome} followed.'
      - By {year}, {figure}'s troubles over {cause} had become public, ending in {outcome}.
      - '{year} brought {figure} face to face with the authorities over {cause}, and {outcome}.'
      - '{figure} was called to account in {year} for {cause}, settled with {outcome}.'
      - Questions were asked in {year} about {figure} and {cause}; the answer was {outcome}.
      - '{figure} spent {year} explaining {cause} to people who didn''t want excuses, and got {outcome}.'
      - In {year}, {cause} caught up with {figure}, resulting in {outcome}.
      - '{figure}''s dealings with {cause} came to a head in {year}: {outcome}.'
      - By {year}, {figure} had traded {cause} for {outcome}, one way or another.
  - id: philanthropy
    requires_place: existing
    place_filter: active_place
    effects: philanthropy
    grammar:
      TEXT:
      - '{figure} funded repairs to {place} in {year}, out of devotion to {domain} -- or so it was said.'
      - In {year}, {figure} quietly paid for repairs at {place}.
      - '{figure} gave generously to {place} in {year}, and made sure people knew it.'
