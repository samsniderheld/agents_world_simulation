# ============================================================================
# EVENTS
# The event templates that write the history, and their word lists.
# effects / place_filter / precondition name behaviours in history/events.py.
# ============================================================================
events:
  # domain values may themselves start with "the" (e.g. "the press"), so
  # these deliberately don't prepend their own article before {domain}.
  generic_causes:
    - "a matter of {domain}"
    - "reasons the old records leave unclear"
    - "a dispute no one now remembers clearly"
    - "what was once called simply \"{domain} business\""
    - "an old grudge nobody could quite explain"
    - "a matter tied up with {domain} somehow"
    - "money that changed hands more than once"
    - "a promise made and later regretted"
    - "a falling-out no one wanted to discuss"
    - "whatever was left unsaid about {domain}"
    - "a debt several people claimed to have forgotten"
    - "words exchanged that couldn't be taken back"
    - "a secret that was never quite kept"
    - "a bet that went badly for someone"

  # Mixed articles are deliberate: every template phrases these as
  # "lost to {disaster}" / "consumed by {disaster}", which both read fine
  # whether or not the phrase itself carries an article.
  disasters:
    - fire
    - a storm
    - a riot
    - a flood
    - an explosion
    - a collapse
    - a blackout
    - vandals
    - a gas leak
    - looters
    - a blizzard
    - a boiler burst
    - an epidemic
    - the wrecking crews

  scandal_tags:
    - bribery
    - smuggling
    - adultery
    - embezzlement
    - blasphemy
    - forgery
    - perjury
    - arson
    - counterfeiting
    - extortion
    - nepotism
    - profiteering
    - desertion
    - bigamy
    - sedition
    - graft

  political_outcomes:
    - a night in the Tombs
    - a heavy fine
    - a public apology
    - quiet exile from the ward
    - a pardon bought with favors
    - a suspended sentence
    - a transfer to another precinct
    - a closed-door settlement
    - a demotion no one dared mention
    - a favor owed to the judge
    - a story that never made the papers
    - a resignation dressed up as retirement
    - a stern word from the alderman
    - a wager settled quietly
    - a debt paid in political capital

  # A subset of dramatic event kinds get a shot at an LLM prose flourish
  # (config.LLM_FLOURISH_RATE); everything else stays pure grammar output.
  notable_template_ids:
    - found_place
    - place_destroyed
    - rebuilt_place
    - expansion

  # Each template: id (unique string), requires_place ("new" | "existing" |
  # null), place_filter (optional, only for "existing" -- name of a function
  # in events.py's _PLACE_FILTERS), precondition (optional -- name of a
  # function in _PRECONDITIONS, gates whether this template is even eligible
  # this turn), effects (name of a function in _EFFECTS -- mutates
  # figure/place in place and returns extra Gospel-text context slots), and
  # grammar (a grammar.expand() dict; must have a "TEXT" symbol, may have
  # others, including alternate text symbols an effects function can
  # redirect to via the special "_text_symbol" context key -- see
  # feud_violence's TEXT_DEATH branch).
  event_templates:
    - id: found_place
      requires_place: new
      effects: found_place
      grammar:
        TEXT:
          - "In {year}, {figure} of {domain} founded {place}, a {place_noun}, {founding_flourish}."
          - "{figure} opened the doors of {place} in {year}, a {place_noun} that would carry the mark of {domain} for years to come."
          - "{figure} laid the first stone of {place} in {year}, {founding_flourish}."
          - "{place} first opened for business in {year}, {figure}'s answer to {domain}."
          - "By {year}, {figure} had turned a notion into {place}, a new {place_noun} {founding_flourish}."
          - "{figure} christened {place} in {year}, a {place_noun} built {founding_flourish}."
          - "In {year}, what would become {place} started as little more than {figure}'s idea, {founding_flourish}."
          - "{figure} threw open the doors of {place}, a {place_noun}, {founding_flourish}, in {year}."
