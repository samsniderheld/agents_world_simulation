# ============================================================================
# ARCHITECTURE
# Building styles per era and the kind of structure each place type is.
# ============================================================================
architecture:
  # Real architectural styles/materials/features per era, used to ground
  # both the offline grammar fallback and the LLM prompt in architecture.py's
  # describe() -- crossed with place_scale below (what kind of building this
  # place_type actually is) so a description is never just "an era-styled
  # building" but "a cramped tenement" vs. "an imposing counting house" built
  # in that era's real style.
  eras:
    dutch_colonial:
      style: "Dutch Colonial"
      materials:
        - "red brick laid in cross-bond"
        - "rough-hewn fieldstone"
        - "heavy timber framing"
        - "hand-split cedar shingles"
      features:
        - "a stepped gable facing the street"
        - "small leaded-glass windows"
        - "a steep jerkinhead roof"
        - "a low stone stoop worn smooth"
        - "shutters banded in hand-forged iron"
      adjectives: ["squat", "narrow-fronted", "steep-roofed", "sturdy"]

    english_colonial:
      style: "Georgian"
      materials:
        - "brick laid in Flemish bond"
        - "white-painted clapboard"
        - "dressed stone lintels"
        - "hand-planed wood paneling"
      features:
        - "a symmetrical facade of tall sash windows"
        - "a fanlight over the door"
        - "a hipped roof with dormers"
        - "paneled shutters"
        - "a modillioned cornice"
      adjectives: ["formal", "symmetrical", "boxy", "dignified"]

    early_republic:
      style: "Federal"
      materials:
        - "red brick with white marble trim"
        - "polished marble stoops"
        - "wrought iron railings"
        - "Flemish-bond brick"
      features:
        - "a fanlight and sidelights framing the door"
        - "tall narrow windows with six-over-six panes"
        - "a low-pitched roof hidden behind a parapet"
        - "delicate iron balconies"
        - "a plain, restrained doorway"
      adjectives: ["restrained", "elegant", "austere", "upright"]

    antebellum:
      style: "Greek Revival"
      materials:
        - "brownstone"
        - "cast iron"
        - "brick with stone quoins"
        - "painted stucco"
      features:
        - "a pedimented doorway framed by columns"
        - "tall parlor-floor windows"
        - "a heavy projecting cornice"
        - "an iron areaway fence"
        - "a raised stone stoop"
      adjectives: ["imposing", "temple-fronted", "heavy", "severe"]

    gilded_age:
      style: "Romanesque Revival / Beaux-Arts"
      materials:
        - "rusticated brownstone"
        - "cast iron storefront columns"
        - "carved limestone"
        - "glazed terracotta ornament"
      features:
        - "an ornate cornice crowded with carved detail"
        - "round-arched windows"
        - "a steep mansard roof"
        - "elaborate wrought-iron grillwork"
        - "a heavy stone porte-cochere"
      adjectives: ["ornate", "monumental", "opulent", "soot-blackened"]

    progressive:
      style: "early steel-frame / Beaux-Arts commercial"
      materials:
        - "glazed white terracotta"
        - "exposed structural steel"
        - "pressed brick"
        - "plate glass"
      features:
        - "a fire escape zigzagging up the facade"
        - "a narrow dumbbell air shaft"
        - "large plate-glass storefront windows"
        - "a cornice of stamped tin"
        - "a wooden water tower on the roof"
      adjectives: ["crowded", "utilitarian", "soot-stained", "teeming"]

    prohibition:
      style: "Art Deco"
      materials:
        - "polished black granite"
        - "chrome and glass"
        - "dark enameled panels"
        - "glazed terracotta"
      features:
        - "a stepped, setback silhouette"
        - "geometric zigzag ornament over the door"
        - "a discreet, unmarked entrance"
        - "neon lettering in the window"
        - "a blacked-out basement doorway"
      adjectives: ["sleek", "angular", "shadowy", "understated"]

    depression_war:
      style: "Streamline Moderne / postwar utilitarian"
      materials:
        - "poured concrete"
        - "glass block"
        - "painted cinderblock"
        - "aluminum trim"
      features:
        - "rounded corners and horizontal banding"
        - "a wall of glass-block windows"
        - "a plain flat roof"
        - "a hand-lettered sign over the door"
        - "blackout curtains still hanging in the windows"
      adjectives: ["spare", "functional", "weathered", "unassuming"]

  # place_type -> what scale/kind of structure it actually is, independent
  # of era -- this is the other half of the cross product, so a counting
  # house and a tenement built in the same year still read as different
  # buildings, not just the same box in different paint.
  place_scale:
    Tavern/Bar: "a modest storefront tavern"
    Inn: "a low roadside inn with a stable yard"
    Coffee House: "a crowded two-room coffee house"
    Speakeasy: "an unmarked storefront"
    Cocktail Lounge: "a dim, narrow cocktail lounge"
    Brewery: "a squat brick brewery with a malting floor"
    Restaurant: "a modest storefront restaurant"
    Diner/Automat: "a bright, narrow lunchroom"
    Hotel/Boarding House: "a many-windowed lodging house"
    Trading Post: "a stockaded trading post"
    General Store/Shop: "a narrow storefront shop"
    Grocery/Corner Store: "a cramped corner grocery"
    Supermarket: "a wide, low self-service market"
    Market: "an open-fronted market stall"
    Department Store: "a many-storied emporium"
    Pawnshop: "a barred-window pawnshop"
    Garage/Filling Station: "a corner garage with a fuel pump out front"
    Craftsman's Workshop: "a small working craftsman's shop"
    Factory/Mill: "a sprawling industrial mill"
    Shipyard/Dock/Warehouse: "a sprawling waterfront warehouse"
    Bank/Counting House: "an imposing counting house"
    Union Hall: "a plain meeting hall above a storefront"
    Newspaper/Print Shop: "a working print shop"
    Radio Station: "a studio building crowned with a transmitter mast"
    Theater/Hall: "a grand public hall"
    Dance Hall: "a long upstairs dance hall"
    Nickelodeon: "a converted storefront picture house"
    Movie Palace: "an ornate movie palace"
    Nightclub/Jazz Club: "a basement nightclub"
    Pool Hall: "a long, smoky pool hall"
    Policy Shop/Gambling Den: "a back room behind a cigar store"
    Brownstone/Townhouse: "a narrow row house"
    Tenement/Residence: "a cramped multi-family tenement"
    Apartment House: "a tall elevator apartment house"
    Housing Project: "a cluster of plain brick towers"
    Church/House of Worship: "an imposing house of worship"
    School: "a plain schoolhouse"
    Park/Public Square: "an open public square"
    Government/Civic Building: "a monumental civic building"
    Fort/Garrison: "a walled earthwork fort"
    Hospital: "a long institutional hospital"
    Social/Fraternal Club: "a private clubhouse"
  landscape_place_types:
  - Park/Public Square

# ============================================================================
# RESIDENTS
# Templates for present-day residents generated without the LLM.
# ============================================================================
characters:
  # Fallback (no-LLM) personal life-history sentences -- see characters.py's
  # _fallback_life_history(). Three phase pools spanning a resident's own
  # lifetime (birth -> present), each a complete sentence with
  # {name}/{place}/{domain} slots, one line drawn from each phase in order
  # so even the offline fallback reads as a real (if brief) life arc rather
  # than three unrelated facts.
  life_event_templates:
    early:
      - "{name} was born into a family that never had much money, but never went without."
      - "{name} grew up in a cramped tenement full of noise and cousins."
      - "{name} showed an early stubborn streak that never really went away."
      - "{name} lost a parent young, and grew up faster for it."
      - "{name} was, by all accounts, an unremarkable child, right up until they weren't."
    arrival:
      - "{name} first came to {place} looking for work, and never really left."
      - "{name} took up with {place} almost by accident, and stayed out of habit."
      - "{name} arrived in the neighborhood with little more than a suitcase and an address."
      - "{name} found steady footing at {place} after a string of jobs that didn't stick."
      - "{name} settled into the rhythm of life at {place}, for better or worse."
    recent:
      - "{name} has become a fixture around {place}, whether anyone asked for that or not."
      - "{name} earned a quiet reputation locally, tied up with {domain} more than anything."
      - "{name} still can't say exactly how the years added up so fast."
      - "{name} keeps mostly to old routines these days, and doesn't apologize for it."
      - "{name} has seen enough of the neighborhood change to have opinions about all of it."

  # Free-prose hints handed to the LLM (loose instructions, not filled-in
  # sentences) describing a resident's relationship to their grounding place.
  relationship_hints:
    active:
      - "a descendant of the founder, who still runs the place today"
      - "the current owner, unrelated by blood but a little obsessed with its history"
      - "a longtime employee who knows every story the walls could tell"
      - "a regular who has practically lived there for decades"
      - "a former rival owner who bought in rather than lose out entirely"
      - "the bartender who's poured drinks there since before most of the regulars were born"
      - "a silent partner who never wanted their name on the sign"
      - "the founder's estranged relative, back in town and trying to make peace with the place"
      - "someone who won a stake in the place in a card game and never left"
      - "the cook who's been in the kitchen so long the recipes are unofficially theirs"
      - "a former employee who bought out the owner when they retired"
      - "the neighborhood fixture who treats the place like a second home"
      - "a distant cousin of the founder who showed up one day and simply stayed"
      - "the one who remembers every regular's order and most of their secrets"
    gone:
      - "a descendant of the founder, who never quite got over losing it"
      - "someone who grew up on family stories about the place, told long after it was gone"
      - "a local historian fixated on what the place used to be"
      - "an old-timer who still tells stories about it to anyone who'll listen"
      - "the last employee to lock up before it closed for good"
      - "someone who still walks past the empty lot out of habit"
      - "a former regular who never found anywhere quite like it again"
      - "the founder's grandchild, raised on stories of a place they never saw standing"
      - "someone who keeps a photograph of it on their wall"
      - "the one who tried and failed to save it from closing"
      - "a former rival who somehow misses it more than anyone expected"
      - "someone who still refers to the block by its old name"
      - "the last person to hold a key to a door that no longer exists"
      - "someone who blames themselves, fairly or not, for what happened to it"

  # Fallback (no-LLM) bio sentences -- separate pools per (place still
  # standing vs. gone) x (a founder exists to reference or not), each a
  # complete sentence with {name}/{place}/{founder} slots, unlike the free
  # prose hints above which only need to work as loose LLM instructions. Kept
  # as four separate pools (rather than one generic template) so a "no blood
  # relation" hint can never get a contradictory "descended from" clause
  # spliced into it, and {place} never dangles awkwardly at a sentence's end.
  bio_templates:
    active_with_founder:
      - "{name}, descended from {founder}, still runs {place} to this day."
      - >-
        {name} owns {place} now -- no blood relation to {founder}, the
        original founder, but you would never know it from how they talk
        about the place.
      - "{name} took over from {founder} years ago and has run {place} exactly the same way ever since."
      - "{name} never met {founder}, but keeps their photograph behind the counter at {place} all the same."
      - "{name} married into the family that founded {place}, and stayed long after {founder} was gone."
      - "{name} was handed the keys to {place} by {founder} personally, with a single word of advice."
      - "{name} bought {place} from {founder}'s estate and refuses to change a single fixture."
      - "{name} apprenticed under {founder} at {place} and never left."
      - "{name} is {founder}'s great-nephew, and the only one in the family who still wanted {place}."
      - "{name} inherited {place} from {founder} along with debts nobody mentioned until later."
      - "{name} promised {founder} on their deathbed that {place} would never close, and it hasn't."
      - "{name} was {founder}'s rival for years before ending up as the one who kept {place} alive."
    active_no_founder:
      - "{name} has worked at {place} so long that half the neighborhood assumes they own it."
      - "{name} has been a regular at {place} for as long as anyone can remember."
      - "{name} started sweeping the floors at {place} as a kid and simply never stopped coming back."
      - "{name} moved to the neighborhood specifically to be closer to {place}."
      - "{name} has a permanent seat at {place} that everyone knows better than to take."
      - "{name} took over {place} sight unseen and has never regretted it."
      - "{name} treats {place} like an office, a living room, and a confessional all at once."
      - "{name} has kept {place} running through more hard years than they like to count."
      - "{name} learned the trade at {place} and never saw a reason to work anywhere else."
      - "{name} shows up at {place} so reliably that the staff set their clocks by it."
      - "{name} talks about {place} the way other people talk about family."
      - "{name} has quietly kept {place} afloat more than once, and never mentions it."
    gone_with_founder:
      - "{name}, descended from {founder}, never quite got over losing {place}."
      - "{name} grew up on family stories about {place}, stories that always started with {founder}."
      - "{name} was the last person {founder} trusted with the keys to {place}, for all the good it did."
      - "{name} still has the ledger {founder} kept at {place}, and can't bring themselves to throw it out."
      - "{name} watched {founder}'s life's work at {place} disappear and never quite forgave the city for it."
      - "{name} was {founder}'s apprentice at {place} right up until there was nothing left to apprentice at."
      - "{name} carries {founder}'s watch, the one thing salvaged from {place} before it closed."
      - "{name} promised {founder} they'd reopen {place} one day, and still means it."
      - "{name} was too young to know {founder}, but grew up hearing exactly what {place} meant to them."
      - "{name} blames themselves for not being there the night {place} went under, the same way {founder} once was."
      - "{name} kept {founder}'s old sign from {place} in a garage, waiting for a reason to hang it up again."
      - "{name} is the last living relative of {founder} who still talks about {place} like it's coming back."
    gone_no_founder:
      - "{name} is the closest thing the neighborhood has to a historian of {place}."
      - "{name} still tells stories about {place} to anyone who'll listen."
      - "{name} can point to the exact spot where {place} used to stand."
      - "{name} still has a matchbook from {place} tucked in a drawer somewhere."
      - "{name} was there the night {place} closed for good and has never quite gotten over it."
      - "{name} keeps a scrapbook of newspaper clippings about {place}, just in case anyone asks."
      - "{name} can recite the entire layout of {place} from memory, decades on."
      - "{name} still meets old friends near where {place} used to be, out of habit more than anything."
      - "{name} was practically raised inside {place} before it disappeared."
      - "{name} has never quite trusted whatever replaced {place} on that corner."
      - "{name} can tell you exactly what {place} smelled like, if you ask."
      - "{name} still marks the anniversary of the day {place} closed."

  # Fallback (no-LLM) physical appearance + wardrobe sentences -- appended
  # to the bio (see characters.py's _fallback_character()) so a resident
  # always has SOME concrete visual description a costume/production
  # designer (or a Treatment's storyboard prompt, see treatment.py's
  # _cast_block) could actually use, not just personality/relationship
  # facts. Deliberately gender-neutral (names.yaml's word lists aren't
  # split by gender either, see _fallback_character's docstring) and noir-
  # appropriate, one self-contained sentence with a {name} slot.
  appearance_templates:
    - "{name} has a weathered face and the kind of build that comes from years of honest work, and is rarely seen without a battered felt hat."
    - "{name} dresses plainly but neatly -- a worn wool coat, always buttoned, no matter the weather."
    - "{name} has sharp, watchful eyes and keeps their hair slicked back out of old habit."
    - "{name} favors a single good suit, pressed within an inch of its life, over an otherwise threadbare wardrobe."
    - "{name} has calloused hands and rolled-up sleeves that say more about a day's work than any words would."
    - "{name} wears a long dark overcoat like armor, collar up, rain or shine."
    - "{name} has a lean, wiry frame and the restless energy of someone who never quite sits still."
    - "{name} keeps a cigarette perpetually at hand and a tie perpetually loosened."
    - "{name} has soft, ink-stained fingers and wire-rimmed spectacles pushed low on the nose."
    - "{name} carries themselves with an old-fashioned formality, right down to the polished shoes and the pocket watch."
    - "{name} has a broad, sturdy build and sleeves that never quite stay rolled down."
    - "{name} favors muted, practical colors -- greys and browns -- and a hat pulled low."

