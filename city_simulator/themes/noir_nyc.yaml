# ============================================================================
# PROMPTS
# Every prompt the app sends a language model, as templates.
# ============================================================================
prompts:
  history:
    figure_name: Give one plausible full person name (first and last) for a {role} living in New York City during
      {era_name} (roughly {era_start}-{era_end}). Reply with ONLY the name, nothing else -- no titles, no explanation.
    figure_name_no_era: Give one plausible full person name for a {role} in old New York City. Reply with ONLY the
      name, nothing else -- no titles, no explanation.
    place_name: Give one short, period-appropriate business/place name for a {place_type} in New York City around
      {year}, founded by someone surnamed {surname}, thematically associated with "{domain}". Reply with ONLY the
      name, nothing else.
    event_flourish: |-
      Rewrite the following sentence describing a historical event in old New York City so it reads as slightly more vivid, period-flavored prose. Keep every proper noun, name, date, and fact EXACTLY as given -- do not invent or remove any of them, and keep it to one sentence. Reply with ONLY the rewritten sentence.

      Sentence: {text}
    architecture: Describe, in exactly one vivid sentence, the architecture and physical appearance of a {place_noun}
      in New York City, built during the "{era_name}" era ({era_start}-{era_end}). The dominant architectural style
      of that era is {style}. Reference real, period-appropriate materials and details, sized appropriately for
      a {place_noun} specifically -- not a mansion or a monument, unless that's genuinely what a {place_noun} would
      be. Reply with ONLY the sentence, no preamble.
    architecture_fallback_building: '{scale}, {adjective} and built of {material}, notable for {feature}.'
    architecture_fallback_landscape: '{scale}, laid out in a {adjective} {style} taste, with {feature}.'
    summary: |-
      You are a local historian writing the opening passage of a chronicle of a single east coast instpired city, from its Dutch colonial founding through the late 1950s. Below is the complete chronological record of everything that happened there -- every founding, fire, feud, scandal, and death.

      {record}

      Write a short narrative summary (3-5 paragraphs) of this city's history: its overall arc across the eras, a few of its most vivid or consequential moments, and what ties it all together. Third person, engaging prose, as if opening a book about the city. Reply with ONLY the summary text -- no heading, no preamble.
    summary_fallback: A history spanning {first_year}-{last_year}, encompassing {figures} notable figures and {places}
      places across {events} recorded events.
    character_place: 'Place: {place}, a {place_noun}, founded {founded}, thematically associated with "{domain}".
      Current status: {status}.'
    character_founder: 'Founded by: {founder}, a {founder_role}.'
    character_anecdote: 'A recorded incident there: {anecdote}'
    character_relationship: Write this character as {relationship}.
    character_occupation: 'This character''s occupation must be: {occupation}.'
    character_sex: This character is {sex}.
    character_constraint_occupation: ', whose occupation is exactly "{occupation}"'
    character_constraint_sex: ' and who is {sex}'
    character_dossier: |-
      You are writing a short character dossier for a resident of an alternate-history New York City, living around 1959, in a film noir style world. the character should feel like an archetype from those types of movies.Here is a real piece of that city's generated history:

      {history_lines}

      Invent ONE person deeply connected to this specific history{constraint}. Reply in exactly this format, nothing else:
      NAME: <full name>
      AGE: <integer between 20 and 75>
      OCCUPATION: <short phrase>
      QUIRK: <one distinctive habit or trait, a few words>
      BIO: <4-6 sentences, third person, naturally weaving in the place name, its domain, and the historical detail above -- specific to this history, not generic. Within this, include a vivid PHYSICAL DESCRIPTION -- build, face, notable features -- and their WARDROBE, what they typically wear -- concrete visual details a costume and production designer could actually use, not just personality or backstory.>
    life_history: |-
      {name} is a {age}-year-old {occupation} in an alternate-history New York City in {present_year}, born around {birth_year}.

      Their dossier: {bio}

      Write {count} short chronological life events spanning {first_name}'s whole life, from around {birth_year} to {present_year} -- childhood, how they came to {place}, turning points, that sort of thing. Each a single sentence, third person, in the same vivid period prose style as the dossier above. Reply with ONLY the events, one per line, oldest first, in exactly this format:
      <year>: <event sentence>
    character_fallback_occupation_active: Keeper of {place}
    character_fallback_occupation_gone: Historian of {place}
    character_fallback_bio: '{relationship_sentence} {place} is the old {place_noun} steeped in {domain}. Ask {first_name}
      about it and they will talk your ear off. {appearance}'
    character_fallback_quirk: can't stop talking about {domain}
  images:
    portrait: Head-and-shoulders portrait photograph of {name}, a {age}-year-old {occupation} in New York City in
      the late 1950s. {bio} Facing the camera, plain neutral backdrop, natural light, period-accurate hair and clothing,
      realistic photograph, no text.
    exterior: Exterior photograph of {name}, a {place_noun} in New York City, seen from the street as it stands
      in the late 1950s. {architecture} Realistic street-level photograph, the whole building facade in frame, no
      people blocking the view, no text or signage besides the establishment's own name.
  scene:
    identity: '{name} is a {age}-year-old. Personality: {traits}. Currently: {currently}. Right now, {name} is at
      {location}.'
    cast_constraint: 'The only other named people who exist in this simulation are: {names}. Do not invent or name
      any other person. Refer to anyone else only in generic, unnamed terms (e.g. ''the bartender'', ''a passerby'').'
    cast_constraint_empty: No other named people exist in this simulation yet. Do not invent or name anyone -- refer
      to anyone else only in generic, unnamed terms (e.g. 'the bartender', 'a passerby').
    directive: 'Direction for this scene (follow this where it''s relevant, without ignoring who the character actually
      is): {directive}'
    plan: |-
      {identity}

      {cast_constraint}
      {directive_block}
      What {name} remembers from before -- for context only, NOT a template to repeat:
      {memories}

      {name} typically starts the day around: {currently}.
      Plan what {name} is trying to do over the next {horizon}{window}: their goals for that whole stretch and what they'll actually spend it on, sized to the stretch -- a week's plan is a week of intentions, not one day's errands. This is NOT the same stretch as any of the memories above -- move the story forward: pick up an unfinished thread, follow up on someone mentioned above, or react to a consequence of what already happened.

      Give exactly {n_items} items in the order they'll happen, each covering roughly {per_item}. Each item is a short phrase. One item per line, no numbering, no times.
    plan_window: ', from {now} until {until}'
    plan_no_memories: (no memories yet)
    now: It is currently {now}.
    decompose: |-
      {identity}

      {cast_constraint}
      {directive_block}
      {now_line}{task}{where_block}
    decompose_one: |-
      {name}'s plan for this stretch: "{step}"

      Describe what {name} actually does over this stretch ({span}) as ONE action -- a single short line, no numbering.
    decompose_many: |-
      {name}'s broad plan step: "{step}"

      Break this into {n} smaller, sequential actions ({span} each). One action per line, no numbering.
    where: |-
      {name} is currently at "{location}". Where should {name} be for this whole step? Pick exactly one place from this list, or STAY to remain where {name} is: {places}
      On its own final line, after the actions above, write:
      WHERE: <one place name from the list, or STAY>
    react: |-
      {identity}

      {cast_constraint}
      {directive_block}
      Relevant memories:
      {memories}

      {name}'s current planned action: {action}
      New observation: {observation}

      Should {name} keep doing the planned action, or react to the observation with something different? Reply with exactly one line in the form:
      REACT: <new action description>
      or:
      CONTINUE
    react_no_memories: (none yet)
    conversation: |-
      Two people are face to face at {place}.

      SPEAKER: {a_name}
      {a_identity}
      {a_name} is currently: {a_doing}
      What {a_name} remembers about {b_name} and related things:
      {a_memories}

      SPEAKER: {b_name}
      {b_identity}
      {b_name} is currently: {b_doing}
      What {b_name} remembers about {a_name} and related things:
      {b_memories}
      {directive_block}
      Write the conversation between them: at most {max_turns} lines, alternating, {a_name} speaking first. Each line is exactly "Name: what they say" -- one or two sentences of spoken words only, no stage directions or narration. They address each other only by these two names; anyone else mentioned comes from their memories. End early if the conversation reaches a natural close.
    conversation_no_memories: (nothing yet)
    importance: |-
      On a scale of 1 to 10, where 1 is purely mundane (e.g., brushing teeth, making a bed) and 10 is extremely poignant (e.g., a breakup, a college acceptance), rate the likely poignancy of each of the following events or thoughts.

      {items}

      Reply with one line per item, exactly in the form "<item number>. <rating>" -- a single integer rating from 1 to 10 -- and nothing else.
    focal_points: |-
      Here are a number of recent statements about {name}:
      {statements}

      Given only this information, what are the {n} most salient high-level questions we can ask about the subjects in these statements? Reply with one question per line, no numbering.
    focal_fallback: What matters most to {name} right now?
    insights: |-
      Statements about {name}:
      {statements}

      What {n} high-level insights can you infer from the above statements, in relation to: "{focal}"?
      Reply with one insight per line, in exactly this format:
      <insight> (because of 1, 3)
      where the numbers in parentheses are the statement numbers it's based on.
  treatment:
    main: |-
      You are a film treatment writer adapting a scene transcript into a short video vignette pitch, in a film noir style.

      Cast available in this scene: {cast_names}. Only write about characters who actually appear in the transcript below; do not invent any other named characters.

      {cast_block}{setting_block}{direction_block}Transcript:
      {transcript}

      Write the treatment in exactly this format, with no extra commentary before or after it:

      CHARACTERS:
      - <name> -- <one-line description of their role in this vignette>
      (one line per character who actually appears)

      SYNOPSIS:
      <a tight paragraph, 4-8 sentences, describing what happens in this vignette, written as noir prose>

      STORYBOARD:
      1. <shot description> | Character: <physical description of whoever appears in this shot -- their build, face, and wardrobe, drawn from the cast appearance reference above, not invented -- or "none" for a shot with no one in frame> | Art direction: <set/production design notes> | Lighting: <lighting setup> | DOP: <camera angle, lens, and movement>
      (exactly 6 numbered shots in this format, each a different beat of the story, all consistent with a {visual_look}. Each shot line is used on its own, standalone, to generate that shot's actual image later -- the Character field must repeat enough of their real appearance that the shot still reads correctly by itself, without needing the rest of this treatment for context.)

      The direction should take into account the Japanese concept of MA, focusing on individual moments, the characters within them, and how those characters experience their environment.
    empty_transcript: (nothing happened)
    setting: |-
      Setting: this entire scene takes place at {place_names}. Below is each place's REAL recorded appearance -- base every shot's art direction on this, not on what the name alone suggests, and do not invent or drift to any other location:
      {places}
    setting_place: '- {name}: {architecture}'
    setting_place_unknown: '- {name} (no recorded architecture)'
    cast: |-
      Cast appearance reference -- use these real descriptions for how each character looks and what they wear, do not invent conflicting physical details:
      {people}
    cast_person: '- {name}: {bio}'
    cast_person_unknown: '- {name} (no recorded description)'
    direction: 'SCENE DIRECTION (what this scene was set up to be about -- let it shape the synopsis and shots,
      consistent with the transcript): {directive}'
  city:
    prefix: |-
      This is a simulation of a city: an alternate-history New York City in {present_year}, a film-noir world of rain-slick streets, smoke-filled bars, cops on the take and people keeping secrets. Everything happens in {present_year}: no anachronisms, nothing supernatural.
      {history}Rules for every reply: only people named in the prompt exist -- never invent or name anyone else; refer to anyone else generically ('the bartender', 'a cop'). Answer in exactly the format asked for, with nothing before or after it.
    prefix_history: 'The city''s history, briefly: {summary}'
    hero_tier: You are writing for one of the story's main characters. Be specific, stay true to their personality
      and memories, and keep each answer short.
    background_tier: You are writing for a minor resident of the city. Keep it brief, plain and routine -- ordinary
      life, not drama.
    narrator_tier: 'You are the city''s observer: you read what the simulation recorded and explain it plainly and
      accurately. Use only what the log shows -- never invent events, motives or people; say when the log doesn''t
      tell you.'
    background_identity: '{name}, {age}, {occupation}. {bio} Right now, {name} is at {location}.'
    cast_line: 'People {name} might name here: {names}. Do not invent or name any other person; refer to anyone
      else only generically.'
    cast_line_empty: '{name} should not name anyone -- refer to other people only generically.'
    plan: |-
      {cast_line}
      {directive_block}
      What {name} remembers from before -- context only, not a template to repeat:
      {memories}

      {name} typically starts the day around: {currently}.
      Plan what {name} is trying to do over the next {horizon}, from {now} until {until}: their goals for that stretch and what they'll actually spend it on, moving their story forward.
      Give exactly {n_items} items in order, each covering about {per_item}; each a short phrase, no times. Reply as JSON: {"items": ["...", ...]}
    plan_no_memories: (no memories yet)
    decompose: |-
      {cast_line}
      {directive_block}
      It is currently {now}. {name}'s plan for this stretch: "{step}"
      Break it into {n} sequential actions, {span} each, one short line per action.{where}
      Reply as JSON: {"actions": ["...", ...]{where_json}}
    decompose_where: 'Also pick where {name} should be for this whole step: one of the listed places, or "STAY"
      to remain at {location}. Places: {places}.'
    react: |-
      {cast_line}
      {directive_block}
      Relevant memories:
      {memories}

      {name}'s current planned action: {action}
      New observation: {other} is nearby, currently: {other_doing}.

      What does {name} do? Reply with exactly one line, one of:
      TALK: <what {name} wants to talk to {other} about>
      REACT: <a different action, without talking>
      CONTINUE
    react_no_memories: (none yet)
    dialogue: |-
      {cast_line}
      {directive_block}
      {name} and {listener} are face to face at {place}.
      What {name} remembers about {listener} and related things:
      {memories}

      {opener}Conversation so far:
      {transcript}

      Write {name}'s next line: one or two sentences of spoken words only, no stage directions, addressing only {listener}. {end_hint}{last_turn}
    dialogue_no_memories: (nothing in particular)
    dialogue_nobody_yet: (nobody has spoken yet)
    dialogue_opener: '{name} wants to talk about: {topic}'
    dialogue_end_hint: If the conversation has reached its natural end, reply with just {end_marker}.
    dialogue_last_turn: This is the last line (turn {turn} of {max_turns}).
    importance: |-
      On a scale of 1 to 10, where 1 is purely mundane (e.g., brushing teeth, making a bed) and 10 is extremely poignant (e.g., a breakup, a college acceptance), rate the likely poignancy of each of the following events or thoughts.

      {items}

      Reply as JSON: {"ratings": [one integer 1-10 per item, {count} in all, in order]}
    focal_points: |-
      Here are recent statements about {name}:
      {statements}

      Given only this information, what are the {n} most salient high-level questions we can ask about the subjects in these statements? Reply as JSON: {"questions": ["...", ...]}
    insights: |-
      Statements about {name}:
      {statements}

      What {n} high-level insights can you infer from the above statements, in relation to: "{focal}"? For each, list the statement numbers it is based on. Reply as JSON: {"insights": [{"text": "...", "because": [1, 3]}, ...]}
    schedule: |-
      {directive_block}
      Write {name}'s schedule for {day}, midnight to midnight: 3 to 8 blocks in order, each with a 24-hour start and end time ("HH:MM"), a short activity, and a place from this list only: {places}. "home" is their own home; "elsewhere" is anywhere else in the city. They work at {work} and like to spend free time at {haunt}.
      Reply as JSON: {"schedule": [{"start": "07:00", "end": "08:00", "activity": "...", "place": "..."}, ...]}
    bio_upgrade: |-
      {name} is a {age}-year-old {occupation} in this city in {present_year}. What little is known: {bio}
      Their usual haunts: {work}, {haunt}. They are about to appear in a scene at {place}.
      Write a 4-5 sentence character dossier, third person, consistent with the facts above: who they are, what they want, one secret or pressure in their life, and a concrete PHYSICAL DESCRIPTION and WARDROBE a costume designer could use. Then, on its own last line, 'QUIRK: <one distinctive habit, a few words>'.
    report: |-
      {header}

      The run's log (oldest first; it may start mid-run):
      {log}
      {previous}
      Write a short briefing on what is going on in the city, under these headings:
      STORYLINES: the 2-5 main threads, each one or two sentences naming who is involved and where.
      PLACES: where the crowds and the tension are.
      PEOPLE TO WATCH: residents becoming important, and why.
      {changes}Be concrete and brief; plain text, no markdown.
    report_previous: |-
      Your previous briefing, for comparison -- focus on what has changed since:
      {briefing}
    report_changes: 'CHANGES: what is new since the previous briefing.'
    question: |-
      {header}

      What the run's log says that may be relevant (oldest first):
      {log}

      Question: {question}

      Answer in a few sentences from the log alone, naming who said or did what, and when and where. If the log doesn't answer it, say so and say what it does show. Plain text.
