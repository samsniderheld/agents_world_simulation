<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Agent Thinking Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg: #0a0a0b;
    --panel: #111113;
    --border: #232326;
    --text: #e5e5e8;
    --text-dim: #8a8a92;
    --text-faint: #55555c;
    --accent: #f5c451;
    --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    --sans: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }

  body{
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header{
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex: none;
  }
  header h1{
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
    color: var(--text);
  }
  header .meta{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  header .spacer{ flex: 1; }
  header button, header label.file-btn{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 10px;
    cursor: pointer;
    border-radius: 3px;
  }
  header button:hover, header label.file-btn:hover{ border-color: var(--text-dim); }
  header input[type="file"]{ display: none; }

  .layout{
    flex: 1;
    display: flex;
    min-height: 0;
  }

  aside{
    width: 250px;
    flex: none;
    border-right: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
    padding: 16px;
  }
  aside h2{
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 8px;
  }
  .section{ margin-bottom: 22px; }

  .agent-row{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 4px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12.5px;
  }
  .agent-row:hover{ background: rgba(255,255,255,0.04); }
  .agent-row.off{ opacity: 0.35; }
  .swatch{
    width: 9px; height: 9px;
    border-radius: 50%;
    flex: none;
  }
  .agent-row .name{ font-weight: 600; }
  .agent-row .sub{ color: var(--text-faint); font-size: 10.5px; }

  .kind-row{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px;
    border-radius: 3px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
  }
  .kind-row:hover{ background: rgba(255,255,255,0.04); }
  .kind-row.off{ opacity: 0.3; }
  .kind-row .swatch{ border-radius: 2px; }

  .search-box{
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 8px;
    border-radius: 3px;
  }
  .search-box:focus{ outline: 1px solid var(--accent); }

  main{
    flex: 1;
    overflow-y: auto;
    padding: 8px 20px 60px;
  }

  .empty{
    max-width: 520px;
    margin: 60px auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.7;
  }
  .empty code{
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: var(--mono);
  }

  .tick-header{
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 14px 0 6px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    z-index: 1;
  }
  .tick-header .num{
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent);
  }
  .tick-header .time{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
  }
  .tick-header .rule{
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .event{
    display: flex;
    gap: 10px;
    padding: 3px 0;
    font-size: 13px;
    line-height: 1.5;
    align-items: baseline;
  }
  .event .badge{
    font-family: var(--mono);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 1px 5px;
    border-radius: 2px;
    flex: none;
    width: 68px;
    text-align: center;
    white-space: nowrap;
  }
  .event .agent{ font-weight: 700; flex: none; }
  .event .content{ color: var(--text); word-break: break-word; }
  .event.kind-memory .content{ color: var(--text-dim); font-size: 12px; }
  .event.kind-continue .content{ color: var(--text-faint); }
  .event.kind-action{ margin-top: 6px; }
  .event.kind-action .content{ font-weight: 500; }
  .event.kind-dialogue .content{ font-style: italic; }

  .treatment-card{
    margin: 30px 0 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 6px;
    overflow: hidden;
  }
  .treatment-card .head{
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .treatment-card pre{
    margin: 0;
    padding: 16px;
    white-space: pre-wrap;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text);
  }
</style>
</head>
<body>

<header>
  <h1>Agent Thinking Viewer</h1>
  <div class="meta" id="runMeta"></div>
  <div class="spacer"></div>
  <button id="reloadBtn" title="Re-fetch run_log.json">Reload</button>
  <label class="file-btn" for="fileInput">Load file…</label>
  <input type="file" id="fileInput" accept="application/json" />
</header>

<div class="layout">
  <aside>
    <div class="section">
      <h2>Agents</h2>
      <div id="agentList"></div>
    </div>
    <div class="section">
      <h2>Event types</h2>
      <div id="kindList"></div>
    </div>
    <div class="section">
      <h2>Search</h2>
      <input type="text" class="search-box" id="searchBox" placeholder="filter text…" />
    </div>
  </aside>

  <main id="main">
    <div class="empty">
      Loading <code>run_log.json</code>…
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  const KIND_META = {
    plan:          { label: 'PLAN',      color: '#60a5fa', defaultOn: true },
    decompose:     { label: 'DECOMP',    color: '#3b82f6', defaultOn: true },
    observe:       { label: 'OBSERVES',  color: '#22d3ee', defaultOn: true },
    react:         { label: 'REACTS',    color: '#e879f9', defaultOn: true },
    continue:      { label: 'CONTINUES', color: '#6b7280', defaultOn: true },
    memory:        { label: 'MEMORY',    color: '#9ca3af', defaultOn: false },
    focal:         { label: 'FOCAL',     color: '#fbbf24', defaultOn: true },
    insight:       { label: 'INSIGHT',   color: '#f59e0b', defaultOn: true },
    action:        { label: 'ACTION',    color: '#e5e7eb', defaultOn: true },
    dialogue:      { label: 'DIALOGUE',  color: '#4ade80', defaultOn: true },
    reflect_pause: { label: 'REFLECT',   color: '#a78bfa', defaultOn: true },
    treatment:     { label: 'TREATMENT', color: '#fca5a5', defaultOn: true },
  };

  const state = {
    data: null,
    agentFilter: new Set(),   // agent names hidden
    kindFilter: new Set(),    // kinds hidden
    search: "",
  };

  const mainEl = document.getElementById('main');
  const agentListEl = document.getElementById('agentList');
  const kindListEl = document.getElementById('kindList');
  const runMetaEl = document.getElementById('runMeta');
  const searchBox = document.getElementById('searchBox');

  for (const kind in KIND_META) {
    if (!KIND_META[kind].defaultOn) state.kindFilter.add(kind);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function agentColor(name){
    const a = (state.data.agents || []).find(x => x.name === name);
    return a ? a.color : '#9ca3af';
  }

  function eventText(ev){
    switch (ev.kind) {
      case 'plan': return `${ev.agent}'s plan for today: ${(ev.items || []).join('; ')}`;
      case 'decompose': return `${ev.agent} breaks "${ev.broad_step}" into: ${(ev.items || []).join('; ')}`;
      case 'observe': return `${ev.agent} notices: ${ev.text}`;
      case 'react': return `${ev.agent} reacts: ${ev.text}`;
      case 'continue': return `${ev.agent} sticks with the plan`;
      case 'memory': return `${ev.agent} remembers (${ev.memory_kind}, importance ${Math.round(ev.importance)}/10): ${ev.text}`;
      case 'focal': return `${ev.agent} wonders: ${ev.text}`;
      case 'insight': return `${ev.agent} realizes: ${ev.text}`;
      case 'action': return `(${ev.location}) ${ev.text}`;
      case 'dialogue': return `→ ${ev.listener}: "${ev.text}"`;
      case 'reflect_pause': return `${ev.agent} pauses to reflect.`;
      default: return ev.text || JSON.stringify(ev);
    }
  }

  function renderSidebar(){
    agentListEl.innerHTML = '';
    (state.data.agents || []).forEach(a => {
      const row = document.createElement('div');
      row.className = 'agent-row' + (state.agentFilter.has(a.name) ? ' off' : '');
      row.title = `${a.traits || ''}${a.location ? ' — ' + a.location : ''}`;
      row.innerHTML = `
        <span class="swatch" style="background:${a.color}"></span>
        <span class="name" style="color:${a.color}">${escapeHtml(a.name)}</span>
        <span class="sub">${a.age ? 'age ' + a.age : ''}</span>
      `;
      row.addEventListener('click', () => {
        if (state.agentFilter.has(a.name)) state.agentFilter.delete(a.name);
        else state.agentFilter.add(a.name);
        renderSidebar();
        renderTimeline();
      });
      agentListEl.appendChild(row);
    });

    kindListEl.innerHTML = '';
    Object.keys(KIND_META).forEach(kind => {
      const meta = KIND_META[kind];
      const row = document.createElement('div');
      row.className = 'kind-row' + (state.kindFilter.has(kind) ? ' off' : '');
      row.innerHTML = `
        <span class="swatch" style="background:${meta.color}"></span>
        <span>${meta.label}</span>
      `;
      row.addEventListener('click', () => {
        if (state.kindFilter.has(kind)) state.kindFilter.delete(kind);
        else state.kindFilter.add(kind);
        renderSidebar();
        renderTimeline();
      });
      kindListEl.appendChild(row);
    });
  }

  function renderMeta(){
    const meta = state.data.meta || {};
    const parts = [];
    if (meta.chat_model) parts.push(`model: ${meta.chat_model}`);
    if (meta.context_tokens) parts.push(`ctx: ${meta.context_tokens}`);
    if (meta.ticks) parts.push(`ticks: ${meta.ticks}`);
    if (state.data.started_at) parts.push(`run: ${new Date(state.data.started_at).toLocaleString()}`);
    runMetaEl.textContent = parts.join('   ·   ');
  }

  function renderTimeline(){
    const events = state.data.events || [];
    const treatmentEvents = events.filter(e => e.kind === 'treatment');
    const tickEvents = events.filter(e => e.kind !== 'treatment');

    const visible = tickEvents.filter(ev => {
      if (state.kindFilter.has(ev.kind)) return false;
      if (ev.agent && state.agentFilter.has(ev.agent)) return false;
      if (state.search) {
        const hay = JSON.stringify(ev).toLowerCase();
        if (!hay.includes(state.search)) return false;
      }
      return true;
    });

    const byTick = new Map();
    visible.forEach(ev => {
      if (!byTick.has(ev.tick)) byTick.set(ev.tick, []);
      byTick.get(ev.tick).push(ev);
    });

    const ticks = Array.from(byTick.keys()).sort((a, b) => a - b);

    mainEl.innerHTML = '';

    if (ticks.length === 0 && treatmentEvents.length === 0) {
      mainEl.innerHTML = '<div class="empty">No events match the current filters.</div>';
      return;
    }

    ticks.forEach(tickNum => {
      const evs = byTick.get(tickNum);
      const timeEv = evs.find(e => e.time);

      const header = document.createElement('div');
      header.className = 'tick-header';
      header.innerHTML = `
        <span class="num">TICK ${tickNum}</span>
        <span class="time">${timeEv ? timeEv.time : ''}</span>
        <span class="rule"></span>
      `;
      mainEl.appendChild(header);

      evs.forEach(ev => {
        const meta = KIND_META[ev.kind] || { label: ev.kind.toUpperCase(), color: '#888' };
        const row = document.createElement('div');
        row.className = `event kind-${ev.kind}`;
        const agentHtml = ev.agent
          ? `<span class="agent" style="color:${agentColor(ev.agent)}">${escapeHtml(ev.agent)}</span>`
          : '';
        row.innerHTML = `
          <span class="badge" style="background:${meta.color}22; color:${meta.color}; border:1px solid ${meta.color}55">${meta.label}</span>
          ${agentHtml}
          <span class="content">${escapeHtml(eventText(ev))}</span>
        `;
        mainEl.appendChild(row);
      });
    });

    treatmentEvents.forEach(ev => {
      const card = document.createElement('div');
      card.className = 'treatment-card';
      card.innerHTML = `
        <div class="head">Treatment</div>
        <pre>${escapeHtml(ev.text)}</pre>
      `;
      mainEl.appendChild(card);
    });
  }

  function loadData(data){
    state.data = data;
    state.agentFilter = new Set();
    renderMeta();
    renderSidebar();
    renderTimeline();
  }

  function showError(msg){
    mainEl.innerHTML = `<div class="empty">${msg}</div>`;
  }

  function fetchLog(){
    fetch('run_log.json', { cache: 'no-store' })
      .then(r => {
        if (!r.ok) throw new Error('not found');
        return r.json();
      })
      .then(loadData)
      .catch(() => {
        showError(
          "Couldn't auto-load <code>run_log.json</code> (this is normal if you " +
          "opened this file directly -- browsers block local fetches from " +
          "<code>file://</code>). Either use <b>Load file…</b> above, or serve " +
          "this folder with <code>python3 -m http.server</code> and reload."
        );
      });
  }

  document.getElementById('reloadBtn').addEventListener('click', fetchLog);

  document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        loadData(JSON.parse(reader.result));
      } catch (err) {
        showError('Could not parse that file as JSON: ' + escapeHtml(err.message));
      }
    };
    reader.readAsText(file);
  });

  searchBox.addEventListener('input', () => {
    state.search = searchBox.value.trim().toLowerCase();
    renderTimeline();
  });

  fetchLog();
})();
</script>
</body>
</html>
