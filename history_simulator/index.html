<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>City Chronicle</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f1e7d0;
    --paper-dim: #e7d9b9;
    --paper-card: #f8f0dd;
    --ink: #2e2116;
    --ink-dim: #6b5842;
    --ink-faint: #9c8a6f;
    --accent: #8c2f1c;
    --gold: #a9822f;
    --border: #c9b98e;
    --serif-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --serif-body: 'Crimson Text', Georgia, 'Times New Roman', serif;
    --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif-body);
  }

  body{ padding: 0 0 80px; }

  ::selection{ background: var(--gold); color: var(--paper); }

  a{ color: var(--accent); }

  header.masthead{
    text-align: center;
    padding: 48px 20px 28px;
    border-bottom: 3px double var(--gold);
    background: linear-gradient(var(--paper-dim), var(--paper));
  }
  header.masthead h1{
    font-family: var(--serif-display);
    font-weight: 700;
    font-size: clamp(32px, 6vw, 56px);
    letter-spacing: 0.02em;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  header.masthead .subtitle{
    font-style: italic;
    color: var(--ink-dim);
    font-size: 16px;
    margin-bottom: 16px;
  }
  header.masthead .stats{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  main{
    max-width: 980px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .map-plate{
    margin: 36px 0;
    border: 1px solid var(--border);
    outline: 1px solid var(--border);
    outline-offset: 4px;
    background: var(--paper-card);
    padding: 22px 20px;
  }
  .map-plate .label{
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .map-plate pre{
    margin: 0;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink);
    overflow-x: auto;
  }
  .map-plate .caption{
    margin-top: 14px;
    font-style: italic;
    color: var(--ink-dim);
    font-size: 14px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .map-plate .neighborhood-key{
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .map-plate .neighborhood-key .entry{
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
  }
  .map-plate .neighborhood-key .swatch{
    width: 10px;
    height: 10px;
    border: 1px solid var(--border);
    flex: none;
  }

  .controls{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 14px 16px;
    background: var(--paper-dim);
    border: 1px solid var(--border);
    margin-bottom: 8px;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .controls input[type="text"], .controls select{
    font-family: var(--serif-body);
    font-size: 14px;
    background: var(--paper-card);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 6px 10px;
  }
  .controls input[type="text"]{ flex: 1; min-width: 160px; }
  .controls .count{
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .era-section{ margin-top: 40px; }
  .era-section.hidden{ display: none; }
  .era-header{
    border-bottom: 1px solid var(--gold);
    padding-bottom: 8px;
    margin-bottom: 16px;
  }
  .era-header h2{
    font-family: var(--serif-display);
    font-weight: 600;
    font-size: 28px;
    margin: 0;
    color: var(--accent);
  }
  .era-header .years{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-faint);
  }
  .era-header .desc{
    font-style: italic;
    color: var(--ink-dim);
    font-size: 14.5px;
    margin-top: 4px;
  }

  .place-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
  }

  .place-card{
    border: 1px solid var(--border);
    background: var(--paper-card);
    padding: 14px 16px;
  }
  .place-card.hidden{ display: none; }
  .place-card .name{
    font-family: var(--serif-display);
    font-weight: 700;
    font-size: 19px;
    margin: 0 0 2px;
  }
  .place-card .meta{
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 8px;
  }
  .place-card .meta .status-destroyed{ color: var(--accent); font-style: italic; }
  .place-card details summary{
    cursor: pointer;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
    list-style: none;
  }
  .place-card details summary::-webkit-details-marker{ display: none; }
  .place-card details summary::before{ content: '▸ '; }
  .place-card details[open] summary::before{ content: '▾ '; }
  .place-card .history{
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    display: grid;
    gap: 6px;
  }
  .place-card .history .entry{
    font-size: 14px;
    line-height: 1.5;
  }
  .place-card .history .entry .year{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    margin-right: 4px;
  }
  .place-card .history .entry .who{ font-weight: 600; }

  details.figures-toggle{ margin-top: 22px; }
  details.figures-toggle summary{
    cursor: pointer;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    list-style: none;
  }
  details.figures-toggle summary::-webkit-details-marker{ display: none; }
  details.figures-toggle summary::before{ content: '▸ '; }
  details.figures-toggle[open] summary::before{ content: '▾ '; }
  .figures-list{
    margin-top: 10px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 6px 18px;
  }
  .figures-list .figure-row{ font-size: 14px; }
  .figures-list .figure-row .role{ color: var(--ink-dim); font-size: 12.5px; }

  .empty-note{
    text-align: center;
    color: var(--ink-faint);
    font-style: italic;
    padding: 60px 20px;
  }

  .residents-section{
    margin-top: 56px;
    padding-top: 20px;
    border-top: 3px double var(--gold);
  }
  .residents-section .section-header h2{
    font-family: var(--serif-display);
    font-weight: 700;
    font-size: 30px;
    color: var(--accent);
    margin: 0;
  }
  .residents-section .section-header .desc{
    font-style: italic;
    color: var(--ink-dim);
    font-size: 14.5px;
    margin: 4px 0 18px;
  }
  .resident-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .resident-card{
    border: 1px solid var(--border);
    background: var(--paper-card);
    padding: 16px 18px;
  }
  .resident-card .name{
    font-family: var(--serif-display);
    font-weight: 700;
    font-size: 20px;
    margin: 0;
  }
  .resident-card .role{
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }
  .resident-card .quirk{
    font-style: italic;
    font-size: 12.5px;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .resident-card .bio{
    font-size: 14.5px;
    line-height: 1.6;
  }
  .resident-card .link{
    display: inline-block;
    margin-top: 12px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<header class="masthead">
  <h1 id="cityTitle">Chronicle of the City</h1>
  <div class="subtitle" id="citySubtitle">Compiled from the historical record</div>
  <div class="stats" id="cityStats"></div>
</header>

<main>
  <div class="map-plate">
    <div class="label">A Map of the City, By Era of Settlement</div>
    <pre id="mapText">Loading…</pre>
    <div class="caption" id="mapCaption"></div>
    <div class="neighborhood-key" id="neighborhoodKey"></div>
  </div>

  <div class="controls">
    <input type="text" id="searchBox" placeholder="Search places, domains, events…" />
    <select id="typeFilter"><option value="">All place types</option></select>
    <select id="statusFilter">
      <option value="">Any status</option>
      <option value="active">Active</option>
      <option value="destroyed">Destroyed</option>
      <option value="closed">Closed</option>
    </select>
    <span class="count" id="visibleCount"></span>
  </div>

  <div id="eraSections"></div>
  <div class="empty-note" id="emptyNote" style="display:none">No places match the current filters.</div>

  <section class="residents-section" id="residentsSection" style="display:none">
    <div class="section-header">
      <h2>Residents of the City, c. 1959</h2>
      <div class="desc">Ten people living here today, each shaped by a piece of everything above.</div>
    </div>
    <div class="resident-grid" id="residentGrid"></div>
  </section>
</main>

<script>
(function(){
  "use strict";

  const state = { data: null, search: "", placeType: "", status: "" };

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function buildIndexes(data){
    const figuresById = new Map(data.figures.map(f => [f.id, f]));
    const placesByEra = new Map(data.eras.map(e => [e.id, []]));
    const figuresByEra = new Map(data.eras.map(e => [e.id, []]));

    data.figures.forEach(f => { if (figuresByEra.has(f.era_id)) figuresByEra.get(f.era_id).push(f); });
    data.places.forEach(p => {
      const founder = figuresById.get(p.founding_figure_id);
      const eraId = founder ? founder.era_id : null;
      if (placesByEra.has(eraId)) placesByEra.get(eraId).push(p);
    });

    return { placesByEra, figuresByEra };
  }

  function renderHeader(data){
    document.getElementById('citySubtitle').textContent =
      `${data.eras[0].start_year}–${data.eras[data.eras.length - 1].end_year} · generated ${new Date(data.generated_at).toLocaleString()}`;
    document.getElementById('cityStats').textContent =
      `${data.eras.length} eras · ${data.figures.length} figures · ${data.places.length} places · ${data.events.length} events`;
  }

  function renderMap(data){
    const map = data.map;
    if (!map || typeof map !== 'object') {
      document.getElementById('mapText').textContent = map || '';
      return;
    }

    const palette = map.palette || {};
    const colorFor = (eraId) => {
      if (eraId === null || eraId === undefined) return palette.water || '#3b5f7a';
      return palette[eraId] || palette.default || '#d4d4d4';
    };

    // Color each character by which neighborhood (era row-band) it's in,
    // or water -- this is what carves each landmass into its actual
    // neighborhoods instead of leaving it one flat color. Grouped into
    // runs per row so the HTML stays compact rather than one span per
    // character.
    const coloredRows = (map.rows || []).map((line, r) => {
      const hoods = (map.cell_neighborhoods && map.cell_neighborhoods[r]) || [];
      let html = '', runColor = null, runText = '';
      const flush = () => {
        if (runText) html += `<span style="color:${runColor}">${escapeHtml(runText)}</span>`;
        runText = '';
      };
      for (let c = 0; c < line.length; c++) {
        const color = colorFor(hoods[c]);
        if (color !== runColor) { flush(); runColor = color; }
        runText += line[c];
      }
      flush();
      return (map.row_prefix || '') + html;
    });

    const header = (map.header_lines || []).map(escapeHtml).join('\n');
    const border = escapeHtml(map.border_line || '');
    document.getElementById('mapText').innerHTML =
      `${header}\n${coloredRows.join('\n')}\n${border}`;
    document.getElementById('mapCaption').textContent = map.caption || '';

    const keyEl = document.getElementById('neighborhoodKey');
    keyEl.innerHTML = (map.neighborhoods || []).map(n =>
      `<span class="entry"><span class="swatch" style="background:${n.color}"></span>${escapeHtml(n.name)}</span>`
    ).join('');
  }

  function populateTypeFilter(data){
    const types = Array.from(new Set(data.places.map(p => p.place_type))).sort();
    const select = document.getElementById('typeFilter');
    types.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t; opt.textContent = t;
      select.appendChild(opt);
    });
  }

  function placeCardHtml(place){
    const statusClass = place.status !== 'active' ? 'status-destroyed' : '';
    const statusText = place.status === 'active'
      ? `founded ${place.founded_year}`
      : `founded ${place.founded_year}, ${place.status}${place.closed_year ? ' ' + place.closed_year : ''}`;
    // gospel_text already names the figure inline (generate.py's prose
    // always does), so there's no need to look figuresById up separately here.
    const historyHtml = place.history.map(h =>
      `<div class="entry"><span class="year">${h.year}</span>${escapeHtml(h.gospel_text)}</div>`
    ).join('');
    const hay = [place.name, place.place_type, place.domain, ...place.history.map(h => h.gospel_text)]
      .join(' ').toLowerCase();

    return `
      <div class="place-card" id="place-${escapeHtml(place.id)}" data-type="${escapeHtml(place.place_type)}" data-status="${escapeHtml(place.status)}" data-hay="${escapeHtml(hay)}">
        <div class="name">${escapeHtml(place.name)}</div>
        <div class="meta">${escapeHtml(place.place_type)} · domain: ${escapeHtml(place.domain)} · <span class="${statusClass}">${statusText}</span></div>
        <details>
          <summary>${place.history.length} recorded event${place.history.length === 1 ? '' : 's'}</summary>
          <div class="history">${historyHtml}</div>
        </details>
      </div>
    `;
  }

  function figureRowHtml(figure){
    const lifespan = figure.death_year ? `${figure.birth_year}–${figure.death_year}` : `b. ${figure.birth_year}`;
    return `<div class="figure-row"><b>${escapeHtml(figure.name)}</b> <span class="role">— ${escapeHtml(figure.role)}, domain: ${escapeHtml(figure.domain)} (${lifespan})</span></div>`;
  }

  function renderEras(data, indexes){
    const container = document.getElementById('eraSections');
    container.innerHTML = '';
    data.eras.forEach(era => {
      const places = indexes.placesByEra.get(era.id) || [];
      const figures = indexes.figuresByEra.get(era.id) || [];

      const section = document.createElement('section');
      section.className = 'era-section';
      section.dataset.eraId = era.id;
      section.innerHTML = `
        <div class="era-header">
          <h2>${escapeHtml(era.name)}</h2>
          <div class="years">${era.start_year}–${era.end_year}</div>
          <div class="desc">${escapeHtml(era.description)}</div>
        </div>
        <div class="place-grid">${places.map(placeCardHtml).join('') || '<p style="color:var(--ink-faint);font-style:italic;">No places founded this era.</p>'}</div>
        ${figures.length ? `
          <details class="figures-toggle">
            <summary>${figures.length} notable figure${figures.length === 1 ? '' : 's'} from this era</summary>
            <div class="figures-list">${figures.map(figureRowHtml).join('')}</div>
          </details>
        ` : ''}
      `;
      container.appendChild(section);
    });
  }

  function residentCardHtml(person){
    const linkHtml = person.place_id
      ? `<a class="link" href="#place-${escapeHtml(person.place_id)}">→ ${escapeHtml(person.place_name)}</a>`
      : '';
    return `
      <div class="resident-card">
        <div class="name">${escapeHtml(person.name)}</div>
        <div class="role">${escapeHtml(String(person.age))} · ${escapeHtml(person.occupation)}</div>
        ${person.quirk ? `<div class="quirk">${escapeHtml(person.quirk)}</div>` : ''}
        <div class="bio">${escapeHtml(person.bio)}</div>
        ${linkHtml}
      </div>
    `;
  }

  function renderResidents(data){
    const people = data.characters || [];
    if (!people.length) return;
    document.getElementById('residentsSection').style.display = '';
    document.getElementById('residentGrid').innerHTML = people.map(residentCardHtml).join('');
  }

  function applyFilters(){
    let visible = 0;
    document.querySelectorAll('.place-card').forEach(card => {
      const matchesType = !state.placeType || card.dataset.type === state.placeType;
      const matchesStatus = !state.status || card.dataset.status === state.status;
      const matchesSearch = !state.search || card.dataset.hay.includes(state.search);
      const show = matchesType && matchesStatus && matchesSearch;
      card.classList.toggle('hidden', !show);
      if (show) visible++;
    });

    document.querySelectorAll('.era-section').forEach(section => {
      const anyVisible = section.querySelectorAll('.place-card:not(.hidden)').length > 0;
      const hasCards = section.querySelectorAll('.place-card').length > 0;
      section.classList.toggle('hidden', hasCards && !anyVisible);
    });

    document.getElementById('visibleCount').textContent = `${visible} of ${document.querySelectorAll('.place-card').length} places shown`;
    document.getElementById('emptyNote').style.display = visible === 0 ? 'block' : 'none';
  }

  document.getElementById('searchBox').addEventListener('input', (e) => {
    state.search = e.target.value.trim().toLowerCase();
    applyFilters();
  });
  document.getElementById('typeFilter').addEventListener('change', (e) => {
    state.placeType = e.target.value;
    applyFilters();
  });
  document.getElementById('statusFilter').addEventListener('change', (e) => {
    state.status = e.target.value;
    applyFilters();
  });

  fetch('history.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(data => {
      state.data = data;
      const indexes = buildIndexes(data);
      renderHeader(data);
      renderMap(data);
      populateTypeFilter(data);
      renderEras(data, indexes);
      renderResidents(data);
      applyFilters();
    })
    .catch(err => {
      document.getElementById('eraSections').innerHTML =
        `<div class="empty-note">Could not load history.json (${escapeHtml(err.message)}). Run <code>python3 generate.py</code> first, or serve this folder so the fetch can reach it.</div>`;
    });
})();
</script>
</body>
</html>
