<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Agent Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg: #0a0a0b;
    --panel: #111113;
    --border: #232326;
    --text: #e5e5e8;
    --text-dim: #8a8a92;
    --text-faint: #55555c;
    --accent: #f5c451;
    --ok: #4ade80;
    --bad: #f87171;
    --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    --sans: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }

  body{
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header{
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex: none;
  }
  header h1{
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
  }

  .status-pill{
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-dim);
  }
  .status-pill .dot{ width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); }
  .status-pill.running .dot{ background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  .status-pill.running{ color: var(--accent); border-color: var(--accent); }
  .status-pill.done .dot{ background: var(--ok); }
  .status-pill.done{ color: var(--ok); border-color: var(--ok); }
  .status-pill.error .dot{ background: var(--bad); }
  .status-pill.error{ color: var(--bad); border-color: var(--bad); }
  @keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.3 } }

  header .error-msg{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--bad);
    max-width: 360px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  header .spacer{ flex: 1; }

  button{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 7px 14px;
    cursor: pointer;
    border-radius: 3px;
  }
  button:hover:not(:disabled){ border-color: var(--text-dim); }
  button:disabled{ opacity: 0.35; cursor: default; }
  button.primary{ border-color: var(--accent); color: var(--accent); }
  button.danger{ border-color: var(--bad); color: var(--bad); }

  .layout{ flex: 1; display: flex; min-height: 0; }

  aside{
    width: 270px;
    flex: none;
    border-right: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
    padding: 16px;
  }
  aside h2{
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 8px;
  }
  .section{ margin-bottom: 20px; }

  .field{ margin-bottom: 10px; }
  .field label{
    display: block;
    font-size: 10.5px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .field input[type="text"], .field input[type="number"]{
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 3px;
  }
  .field input:focus{ outline: 1px solid var(--accent); }
  .field-row{ display: flex; gap: 8px; }
  .field-row .field{ flex: 1; }

  .checkbox-row{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 2px;
    font-size: 12.5px;
    cursor: pointer;
    border-radius: 3px;
  }
  .checkbox-row:hover{ background: rgba(255,255,255,0.04); }
  .checkbox-row input{ accent-color: var(--accent); }
  .checkbox-row .sub{ color: var(--text-faint); font-size: 10px; }

  .agent-row{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 4px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12.5px;
  }
  .agent-row:hover{ background: rgba(255,255,255,0.04); }
  .agent-row.off{ opacity: 0.35; }
  .swatch{ width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .agent-row .name{ font-weight: 600; }

  .kind-row{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px;
    border-radius: 3px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
  }
  .kind-row:hover{ background: rgba(255,255,255,0.04); }
  .kind-row.off{ opacity: 0.3; }
  .kind-row .swatch{ border-radius: 2px; }

  .search-box{
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 8px;
    border-radius: 3px;
  }
  .search-box:focus{ outline: 1px solid var(--accent); }

  main{ flex: 1; overflow-y: auto; padding: 8px 20px 60px; }

  .empty{
    max-width: 480px;
    margin: 60px auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.7;
  }

  .tick-header{
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 14px 0 6px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    z-index: 1;
  }
  .tick-header .num{
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent);
  }
  .tick-header .time{ font-family: var(--mono); font-size: 11px; color: var(--text-faint); }
  .tick-header .rule{ flex: 1; height: 1px; background: var(--border); }

  .event{
    display: flex;
    gap: 10px;
    padding: 3px 0;
    font-size: 13px;
    line-height: 1.5;
    align-items: baseline;
  }
  .event .badge{
    font-family: var(--mono);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 1px 5px;
    border-radius: 2px;
    flex: none;
    width: 68px;
    text-align: center;
    white-space: nowrap;
  }
  .event .agent{ font-weight: 700; flex: none; }
  .event .content{ color: var(--text); word-break: break-word; }
  .event.kind-memory .content{ color: var(--text-dim); font-size: 12px; }
  .event.kind-continue .content{ color: var(--text-faint); }
  .event.kind-action{ margin-top: 6px; }
  .event.kind-action .content{ font-weight: 500; }
  .event.kind-dialogue .content{ font-style: italic; }

  .treatment-card{
    margin: 30px 0 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 6px;
    overflow: hidden;
  }
  .treatment-card .head{
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .treatment-card pre{
    margin: 0;
    padding: 16px;
    white-space: pre-wrap;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text);
  }
</style>
</head>
<body>

<header>
  <h1>Agent Console</h1>
  <div class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">idle</span></div>
  <div class="error-msg" id="errorMsg"></div>
  <div class="spacer"></div>
  <button class="primary" id="startBtn">▶ Start</button>
  <button class="danger" id="stopBtn" style="display:none">■ Stop</button>
</header>

<div class="layout">
  <aside>
    <div class="section">
      <h2>Run</h2>
      <div class="field-row">
        <div class="field">
          <label>Ticks</label>
          <input type="number" id="ticksInput" value="8" min="1" />
        </div>
        <div class="field">
          <label>Tick pause (s)</label>
          <input type="number" id="tickSleepInput" value="0" min="0" step="0.5" />
        </div>
      </div>
      <div class="field">
        <label>Chat model (blank = server default)</label>
        <input type="text" id="modelInput" list="modelOptions" placeholder="auto" />
        <datalist id="modelOptions"></datalist>
      </div>
      <div class="field">
        <label>Context tokens (blank = server default)</label>
        <input type="number" id="contextInput" placeholder="auto" min="256" />
      </div>
    </div>

    <div class="section">
      <h2>Agents</h2>
      <div id="agentPicker"></div>
    </div>

    <div class="section">
      <h2>Legend</h2>
      <div id="agentLegend"></div>
    </div>

    <div class="section">
      <h2>Event types</h2>
      <div id="kindList"></div>
    </div>

    <div class="section">
      <h2>Search</h2>
      <input type="text" class="search-box" id="searchBox" placeholder="filter text…" />
    </div>
  </aside>

  <main id="main">
    <div class="empty">Configure agents on the left and hit <b>Start</b>.</div>
  </main>
</div>

<script>
(function(){
  "use strict";

  const KIND_META = {
    plan:          { label: 'PLAN',      color: '#60a5fa', defaultOn: true },
    decompose:     { label: 'DECOMP',    color: '#3b82f6', defaultOn: true },
    observe:       { label: 'OBSERVES',  color: '#22d3ee', defaultOn: true },
    react:         { label: 'REACTS',    color: '#e879f9', defaultOn: true },
    continue:      { label: 'CONTINUES', color: '#6b7280', defaultOn: true },
    memory:        { label: 'MEMORY',    color: '#9ca3af', defaultOn: false },
    focal:         { label: 'FOCAL',     color: '#fbbf24', defaultOn: true },
    insight:       { label: 'INSIGHT',   color: '#f59e0b', defaultOn: true },
    action:        { label: 'ACTION',    color: '#e5e7eb', defaultOn: true },
    dialogue:      { label: 'DIALOGUE',  color: '#4ade80', defaultOn: true },
    reflect_pause: { label: 'REFLECT',   color: '#a78bfa', defaultOn: true },
    treatment:     { label: 'TREATMENT', color: '#fca5a5', defaultOn: true },
  };

  const state = {
    agents: [],              // current run's agents (name/color/etc)
    roster: [],               // every agent available to pick from
    selectedAgents: new Set(),
    agentFilter: new Set(),   // agent names hidden from the timeline
    kindFilter: new Set(),    // kinds hidden from the timeline
    search: "",
    tickRows: new Map(),      // tick number -> DOM row container
    treatmentEl: null,
    eventSource: null,
    lastStatus: "idle",
  };

  for (const kind in KIND_META) {
    if (!KIND_META[kind].defaultOn) state.kindFilter.add(kind);
  }

  const mainEl = document.getElementById('main');
  const agentPickerEl = document.getElementById('agentPicker');
  const agentLegendEl = document.getElementById('agentLegend');
  const kindListEl = document.getElementById('kindList');
  const searchBox = document.getElementById('searchBox');
  const statusPill = document.getElementById('statusPill');
  const statusText = document.getElementById('statusText');
  const errorMsg = document.getElementById('errorMsg');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function agentColor(name){
    const a = state.agents.find(x => x.name === name);
    return a ? a.color : '#9ca3af';
  }

  // --- setup: roster + models -----------------------------------------

  fetch('/api/roster').then(r => r.json()).then(d => {
    state.roster = d.roster || [];
    state.roster.forEach(a => state.selectedAgents.add(a.name));
    renderAgentPicker();
  });

  fetch('/api/models').then(r => r.json()).then(d => {
    const list = document.getElementById('modelOptions');
    (d.models || []).forEach(m => {
      const opt = document.createElement('option');
      opt.value = m;
      list.appendChild(opt);
    });
  });

  function renderAgentPicker(){
    agentPickerEl.innerHTML = '';
    state.roster.forEach(a => {
      const row = document.createElement('label');
      row.className = 'checkbox-row';
      row.innerHTML = `
        <input type="checkbox" ${state.selectedAgents.has(a.name) ? 'checked' : ''} />
        <span>${escapeHtml(a.name)}</span>
        <span class="sub">age ${a.age}</span>
      `;
      row.querySelector('input').addEventListener('change', (e) => {
        if (e.target.checked) state.selectedAgents.add(a.name);
        else state.selectedAgents.delete(a.name);
      });
      agentPickerEl.appendChild(row);
    });
  }

  function renderLegendAndKinds(){
    agentLegendEl.innerHTML = '';
    state.agents.forEach(a => {
      const row = document.createElement('div');
      row.className = 'agent-row' + (state.agentFilter.has(a.name) ? ' off' : '');
      row.title = `${a.traits || ''}${a.location ? ' — ' + a.location : ''}`;
      row.innerHTML = `
        <span class="swatch" style="background:${a.color}"></span>
        <span class="name" style="color:${a.color}">${escapeHtml(a.name)}</span>
      `;
      row.addEventListener('click', () => {
        if (state.agentFilter.has(a.name)) state.agentFilter.delete(a.name);
        else state.agentFilter.add(a.name);
        applyFilters();
        renderLegendAndKinds();
      });
      agentLegendEl.appendChild(row);
    });

    kindListEl.innerHTML = '';
    Object.keys(KIND_META).forEach(kind => {
      const meta = KIND_META[kind];
      const row = document.createElement('div');
      row.className = 'kind-row' + (state.kindFilter.has(kind) ? ' off' : '');
      row.innerHTML = `<span class="swatch" style="background:${meta.color}"></span><span>${meta.label}</span>`;
      row.addEventListener('click', () => {
        if (state.kindFilter.has(kind)) state.kindFilter.delete(kind);
        else state.kindFilter.add(kind);
        applyFilters();
        renderLegendAndKinds();
      });
      kindListEl.appendChild(row);
    });
  }

  function applyFilters(){
    document.querySelectorAll('.event[data-kind]').forEach(row => {
      const hideKind = state.kindFilter.has(row.dataset.kind);
      const hideAgent = row.dataset.agent && state.agentFilter.has(row.dataset.agent);
      const hideSearch = state.search && !row.dataset.hay.includes(state.search);
      row.style.display = (hideKind || hideAgent || hideSearch) ? 'none' : '';
    });
  }

  searchBox.addEventListener('input', () => {
    state.search = searchBox.value.trim().toLowerCase();
    applyFilters();
  });

  // --- event rendering --------------------------------------------------

  function eventText(ev){
    switch (ev.kind) {
      case 'plan': return `${ev.agent}'s plan for today: ${(ev.items || []).join('; ')}`;
      case 'decompose': return `${ev.agent} breaks "${ev.broad_step}" into: ${(ev.items || []).join('; ')}`;
      case 'observe': return `${ev.agent} notices: ${ev.text}`;
      case 'react': return `${ev.agent} reacts: ${ev.text}`;
      case 'continue': return `${ev.agent} sticks with the plan`;
      case 'memory': return `${ev.agent} remembers (${ev.memory_kind}, importance ${Math.round(ev.importance)}/10): ${ev.text}`;
      case 'focal': return `${ev.agent} wonders: ${ev.text}`;
      case 'insight': return `${ev.agent} realizes: ${ev.text}`;
      case 'action': return `(${ev.location}) ${ev.text}`;
      case 'dialogue': return `→ ${ev.listener}: "${ev.text}"`;
      case 'reflect_pause': return `${ev.agent} pauses to reflect.`;
      default: return ev.text || JSON.stringify(ev);
    }
  }

  function ensureTickRow(tickNum, time){
    if (state.tickRows.has(tickNum)) return state.tickRows.get(tickNum);
    if (mainEl.querySelector('.empty')) mainEl.innerHTML = '';

    const header = document.createElement('div');
    header.className = 'tick-header';
    header.innerHTML = `<span class="num">TICK ${tickNum}</span><span class="time">${time || ''}</span><span class="rule"></span>`;
    mainEl.appendChild(header);

    const body = document.createElement('div');
    body.className = 'tick-body';
    mainEl.appendChild(body);

    state.tickRows.set(tickNum, body);
    return body;
  }

  function renderTreatment(ev){
    const card = document.createElement('div');
    card.className = 'treatment-card';
    card.innerHTML = `<div class="head">Treatment</div><pre>${escapeHtml(ev.text)}</pre>`;
    mainEl.appendChild(card);
  }

  function renderEvent(ev){
    if (ev.kind === 'treatment') return renderTreatment(ev);

    const meta = KIND_META[ev.kind] || { label: ev.kind.toUpperCase(), color: '#888' };
    const container = ensureTickRow(ev.tick, ev.time);
    const row = document.createElement('div');
    row.className = `event kind-${ev.kind}`;
    row.dataset.kind = ev.kind;
    row.dataset.agent = ev.agent || '';
    row.dataset.hay = JSON.stringify(ev).toLowerCase();

    const agentHtml = ev.agent
      ? `<span class="agent" style="color:${agentColor(ev.agent)}">${escapeHtml(ev.agent)}</span>`
      : '';
    row.innerHTML = `
      <span class="badge" style="background:${meta.color}22; color:${meta.color}; border:1px solid ${meta.color}55">${meta.label}</span>
      ${agentHtml}
      <span class="content">${escapeHtml(eventText(ev))}</span>
    `;

    const hideKind = state.kindFilter.has(ev.kind);
    const hideAgent = ev.agent && state.agentFilter.has(ev.agent);
    const hideSearch = state.search && !row.dataset.hay.includes(state.search);
    row.style.display = (hideKind || hideAgent || hideSearch) ? 'none' : '';

    container.appendChild(row);
  }

  function resetTimeline(){
    mainEl.innerHTML = '';
    state.tickRows = new Map();
  }

  // --- streaming ----------------------------------------------------

  function connectStream(){
    if (state.eventSource) state.eventSource.close();
    const es = new EventSource('/api/stream?since=0');
    es.onmessage = (e) => renderEvent(JSON.parse(e.data));
    state.eventSource = es;
  }

  // --- status polling -------------------------------------------------

  function pollState(){
    fetch('/api/state').then(r => r.json()).then(d => {
      state.agents = d.agents || [];
      renderLegendAndKinds();

      const phase = (d.status && d.status.phase) || 'idle';
      statusPill.className = 'status-pill ' + phase;
      statusText.textContent = phase;
      errorMsg.textContent = (d.status && d.status.error) || '';

      startBtn.disabled = phase === 'running';
      stopBtn.style.display = phase === 'running' ? '' : 'none';
    }).catch(() => {});
  }

  setInterval(pollState, 1200);
  pollState();
  connectStream();

  // --- controls -------------------------------------------------------

  startBtn.addEventListener('click', () => {
    const payload = {
      ticks: parseInt(document.getElementById('ticksInput').value, 10) || 8,
      tick_sleep: parseFloat(document.getElementById('tickSleepInput').value) || 0,
      chat_model: document.getElementById('modelInput').value.trim() || null,
      context_tokens: parseInt(document.getElementById('contextInput').value, 10) || null,
      agent_names: Array.from(state.selectedAgents),
    };
    fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).then(r => r.json()).then(d => {
      if (!d.ok) { errorMsg.textContent = d.error || 'could not start run'; return; }
      resetTimeline();
      connectStream();
      pollState();
    });
  });

  stopBtn.addEventListener('click', () => {
    fetch('/api/stop', { method: 'POST' });
  });
})();
</script>
</body>
</html>
